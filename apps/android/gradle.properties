# AndroidX is required by Compose; no application credentials belong here.
android.useAndroidX=true
kotlin.code.style=official

# Release dex merging needs more than Gradle's default 512 MiB heap.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.workers.max=2

# AGP 8.13 removes resources together with unreachable code in release builds.
android.r8.optimizedResourceShrinking=true
