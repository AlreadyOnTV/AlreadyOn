# All proposals enter one weekly batch; combined validation precedes dev integration.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /server
    target-branch: dev
    groups:
      weekly-updates:
        patterns: ['*']
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: America/New_York
  - package-ecosystem: npm
    directories: [/web, /deploy/npm-tooling]
    target-branch: dev
    groups:
      weekly-updates:
        patterns: ['*']
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: America/New_York
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    groups:
      weekly-updates:
        patterns: ['*']
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: America/New_York
  - package-ecosystem: gradle
    directory: /apps/android
    target-branch: dev
    groups:
      weekly-updates:
        patterns: ['*']
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: America/New_York
