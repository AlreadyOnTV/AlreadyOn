# Run source tests in the prebuilt CI base; test results are never cached.
name: Test application source
description: Run Go and full Chromium e2e suites against the selected CI base image
inputs:
  ci-base:
    description: Immutable CI base image reference
    required: true
  pull-base:
    description: Pull ci-base from its registry before testing
    default: "true"
  host-go-cache:
    description: Mount the setup-go module and build caches into the test container
    default: "false"
runs:
  using: composite
  steps:
    - name: Pull the selected CI base
      if: inputs.pull-base == 'true'
      shell: bash
      run: docker pull '${{ inputs.ci-base }}'
    - name: Go tests and Chromium playback tests
      env:
        TEST_MEMORY: 5g
        TEST_TMPFS: 2g
        HOST_GO_CACHE: ${{ inputs.host-go-cache }}
      shell: bash
      run: |
        # Source tests run without Git installed; pass the checkout identity as
        # the same read-only build input used by the production WebUI build.
        revision_file=$(mktemp "$RUNNER_TEMP/alreadyon-web-revision.XXXXXX")
        trap 'rm -f "$revision_file"' EXIT
        git rev-parse HEAD > "$revision_file"
        cache_args=()
        if [[ "$HOST_GO_CACHE" == true ]]; then
          module_cache=$(go env GOMODCACHE)
          build_cache=$(go env GOCACHE)
          mkdir -p "$module_cache" "$build_cache"
          cache_args=(-v "$module_cache:/ci-cache/mod" -v "$build_cache:/ci-cache/build" \
            -e GOMODCACHE=/ci-cache/mod -e GOCACHE=/ci-cache/build)
        fi
        docker run --rm --name "alreadyon-ci-tests-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
          --memory="$TEST_MEMORY" --tmpfs "/tmp:rw,exec,size=$TEST_TMPFS,mode=1777" --user "$(id -u):$(id -g)" \
          -e GOFLAGS=-p=1 -e HOME=/tmp -e TZ \
          "${cache_args[@]}" \
          -v "$GITHUB_WORKSPACE:/workspaces/alreadyon"           -v "$revision_file:/workspaces/web-build-revision:ro" \
          '${{ inputs.ci-base }}' bash -euc \
          'TIMEFORMAT="CI phase %3R seconds"; time npm ci --prefix web; go clean -testcache; time make test; time make test-e2e'
    - name: Clean up the test container after cancellation
      if: always()
      shell: bash
      run: docker rm -f "alreadyon-ci-tests-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >/dev/null 2>&1 || true
