# Build the packaged runtime and Android release artifacts for PR validation.
name: Build validation candidate
description: Build and scan the exact runtime image and release APK dependencies without publication
inputs:
  revision:
    description: Exact checkout revision being validated
    required: true
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v4
    - name: Read shared Ubuntu version
      id: ubuntu
      shell: bash
      run: echo "version=$(sed -n 's/^ARG UBUNTU_VERSION=//p' deploy/Dockerfile)" >> "$GITHUB_OUTPUT"
    - name: Build local runtime base
      uses: docker/build-push-action@v7
      with:
        context: .
        file: deploy/base.Dockerfile
        target: runtime-base
        load: true
        tags: alreadyon-validation:runtime
        build-args: |
          UBUNTU_VERSION=${{ steps.ubuntu.outputs.version }}
          FFMPEG_BUILD_JOBS=2
        cache-from: type=gha,scope=source-validation-runtime
        cache-to: type=gha,scope=source-validation-runtime,mode=max
    - name: Build local CI test base
      shell: bash
      run: |
        docker build --builder default \
          --file deploy/ci-base.Dockerfile \
          --target ci-base \
          --build-arg RUNTIME_BASE=alreadyon-validation:runtime \
          --tag alreadyon-validation:ci .
    - name: Build exact production runtime candidate
      shell: bash
      env:
        SOURCE_REVISION: ${{ inputs.revision }}
      run: |
        test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
        docker build --builder default \
          --file deploy/Dockerfile --target runtime \
          --build-arg CI_BASE=alreadyon-validation:ci \
          --build-arg RUNTIME_BASE=alreadyon-validation:runtime \
          --build-arg VCS_REF="$SOURCE_REVISION" \
          --build-arg BUILD_TIMESTAMP="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
          --tag alreadyon-ci:candidate .
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: "17"
    - uses: android-actions/setup-android@v4
      with:
        packages: "platform-tools platforms;android-37.0 build-tools;36.0.0"
    - name: Build minified unsigned phone and TV release APKs
      shell: bash
      run: apps/android/gradlew -p apps/android --no-daemon :app:assembleRelease :tv:assembleRelease
    - name: Export release-runtime dependency locks
      shell: bash
      run: |
        apps/android/gradlew -p apps/android --no-daemon -I "$GITHUB_WORKSPACE/scripts/security/android-inventory.gradle" \
          -PsecurityInventoryDirectory="$RUNNER_TEMP/android-runtime" securityInventory
    - name: Package exact image and runtime dependencies
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/candidate/android-runtime"
        docker save alreadyon-ci:candidate -o "$RUNNER_TEMP/candidate/runtime.tar"
        docker save alreadyon-validation:ci -o "$RUNNER_TEMP/candidate/ci.tar"
        cp apps/android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/candidate/alreadyon-android.apk"
        cp apps/android/tv/build/outputs/apk/release/tv-release-unsigned.apk "$RUNNER_TEMP/candidate/alreadyon-tv.apk"
        cp "$RUNNER_TEMP"/android-runtime/* "$RUNNER_TEMP/candidate/android-runtime/"
    - name: Scan only shipped runtime components
      shell: bash
      run: |
        python3 scripts/security/install-trivy.py "$RUNNER_TEMP/security-tools"
        python3 scripts/security/scan.py \
          --trivy "$RUNNER_TEMP/security-tools/trivy" \
          --image-archive "$RUNNER_TEMP/candidate/runtime.tar" \
          --android-runtime-locks "$RUNNER_TEMP/candidate/android-runtime" \
          --packaged-only --output "$RUNNER_TEMP/security-report"
        cat "$RUNNER_TEMP/security-report/summary.json" >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@v7
      with:
        name: runtime-candidate-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/candidate
        if-no-files-found: error
        retention-days: 1
