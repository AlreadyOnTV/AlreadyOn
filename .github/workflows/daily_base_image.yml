# Daily refresh builds both shared bases with current upstream packages.
name: Daily Build Base Image
on:
  schedule:
    - cron: "43 6 * * *"
      timezone: America/New_York
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  actions: read
concurrency:
  group: base-images
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      # Use trusted main for both the schedule and manual refresh.
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Make room for the two base images
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo -n rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select recipe revision
        id: base
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/build-bases
        with:
          image: ghcr.io/alreadyontv/alreadyon-base
          revision: ${{ steps.base.outputs.revision }}
          refresh: "true"
      - name: Remove base images older than 30 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/clean-base-images.py --apply
