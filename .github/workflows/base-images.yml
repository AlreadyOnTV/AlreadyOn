# Explicit refresh builds both shared bases with current upstream packages.
name: Refresh Base Images
on:
  # Maintainers explicitly approve registry refreshes.
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: base-images
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      # Build the explicitly selected workflow branch and its current recipe.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Make room for the two base images
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo -n rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select recipe revision
        id: base
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/build-bases
        with:
          image: ghcr.io/alreadyontv/alreadyon-base
          revision: ${{ steps.base.outputs.revision }}
          refresh: 'true'
