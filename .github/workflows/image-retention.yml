# Weekly maintenance combines dependency review and artifact retention.
name: Weekly Maintenance
on:
  schedule:
    - cron: "43 7 * * 1"
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      apply:
        description: Delete the versions shown in the retention plan
        type: boolean
        default: false
permissions:
  contents: read
  packages: read
  pull-requests: read
  actions: read
concurrency:
  group: application-images
  cancel-in-progress: false
jobs:
  dependency-review:
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve published runtime and matching CI baseline
        id: baseline
        run: |
          docker pull ghcr.io/alreadyontv/alreadyon:nightly
          source=$(docker inspect ghcr.io/alreadyontv/alreadyon:nightly --format '{{index .RepoDigests 0}}')
          docker tag "$source" alreadyon-maintenance:runtime
          echo "runtime=alreadyon-maintenance:runtime" >> "$GITHUB_OUTPUT"
          docker pull ghcr.io/alreadyontv/alreadyon-base:base-ci
          ci=$(docker inspect ghcr.io/alreadyontv/alreadyon-base:base-ci --format '{{index .RepoDigests 0}}')
          docker tag "$ci" alreadyon-maintenance:ci
          echo "ci=alreadyon-maintenance:ci" >> "$GITHUB_OUTPUT"
          {
            echo '### Reviewed dependency baseline'
            echo "Runtime: \`$source\`"
            echo "CI: \`$ci\`"
            git rev-parse HEAD
            sha256sum server/go.sum web/package-lock.json deploy/npm-tooling/package-lock.json apps/android/app/build.gradle.kts apps/android/tv/build.gradle.kts apps/android/build.gradle.kts
            docker run --rm --entrypoint sh "$source" -c 'cat /etc/os-release; ffmpeg -version; ffprobe -version'
          } > "$RUNNER_TEMP/dependency-baseline.txt"
          cat "$RUNNER_TEMP/dependency-baseline.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/security-scan
        with:
          image: ${{ steps.baseline.outputs.runtime }}
          ci-image: ${{ steps.baseline.outputs.ci }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.baseline.outcome == 'success' }}
        with:
          name: dependency-baseline-${{ github.run_id }}
          path: ${{ runner.temp }}/dependency-baseline.txt
          retention-days: 90
          if-no-files-found: error
  cleanup:
    permissions:
      contents: write
      packages: write
      pull-requests: read
      actions: write
    concurrency:
      group: base-images
      cancel-in-progress: false
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply retention (manual dispatch defaults to dry run)
        env:
          GH_TOKEN: ${{ github.token }}
          APPLY: ${{ github.event_name != 'workflow_dispatch' || inputs.apply }}
        run: |
          args=()
          if [ "$APPLY" = true ]; then args+=(--apply); fi
          python3 scripts/ci/clean-images.py "${args[@]}"
          python3 scripts/ci/clean-releases.py "${args[@]}"
      - name: Clean closed-PR caches and superseded bases
        env:
          GH_TOKEN: ${{ github.token }}
          APPLY: ${{ github.event_name != 'workflow_dispatch' || inputs.apply }}
        run: |
          args=()
          if [ "$APPLY" = true ]; then args+=(--apply); fi
          python3 scripts/ci/clean-build-storage.py "${args[@]}"
