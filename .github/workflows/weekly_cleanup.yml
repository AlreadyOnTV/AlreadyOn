# Weekly cleanup scans the published runtime and applies artifact retention.
name: Weekly Cleanup
on:
  schedule:
    - cron: "43 7 * * 1"
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      apply:
        description: Delete the versions shown in the retention plan
        type: boolean
        default: false
permissions:
  contents: read
  packages: read
  pull-requests: read
  actions: read
concurrency:
  group: application-images
  cancel-in-progress: false
jobs:
  select-nightly:
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-26.04
    outputs:
      image: ${{ steps.nightly.outputs.image }}
      revision: ${{ steps.nightly.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve the exact Nightly digest and source revision
        id: nightly
        run: |
          docker pull ghcr.io/alreadyontv/alreadyon:nightly
          source=$(docker inspect ghcr.io/alreadyontv/alreadyon:nightly --format '{{index .RepoDigests 0}}')
          revision=$(docker image inspect ghcr.io/alreadyon/alreadyon:nightly --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          [[ "$source" =~ @sha256:[0-9a-f]{64}$ ]]
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "image=$source" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
  security-scan:
    needs: select-nightly
    permissions:
      contents: read
    uses: ./.github/workflows/security_scan.yml
    with:
      image: ${{ needs.select-nightly.outputs.image }}
      source_revision: ${{ needs.select-nightly.outputs.revision }}
  cleanup:
    permissions:
      contents: write
      packages: write
      pull-requests: read
      actions: write
    concurrency:
      group: base-images
      cancel-in-progress: false
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply retention (manual dispatch defaults to dry run)
        env:
          GH_TOKEN: ${{ github.token }}
          APPLY: ${{ github.event_name != 'workflow_dispatch' || inputs.apply }}
        run: |
          args=()
          if [ "$APPLY" = true ]; then args+=(--apply); fi
          python3 scripts/ci/clean-images.py "${args[@]}"
          python3 scripts/ci/clean-releases.py "${args[@]}"
      - name: Clean closed-PR caches and superseded bases
        env:
          GH_TOKEN: ${{ github.token }}
          APPLY: ${{ github.event_name != 'workflow_dispatch' || inputs.apply }}
        run: |
          args=(--caches-only)
          if [ "$APPLY" = true ]; then args+=(--apply); fi
          python3 scripts/ci/clean-build-storage.py "${args[@]}"
