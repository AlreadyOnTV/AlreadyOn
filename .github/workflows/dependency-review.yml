# Block main-bound PRs when dependency changes introduce moderate-or-higher advisories.
name: Dependabot Dependency Review
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  dependabot:
    name: Dependabot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
