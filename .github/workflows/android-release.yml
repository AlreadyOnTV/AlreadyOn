name: Android Alpha, RC and Stable
on:
  push:
    branches: [test, main]
  workflow_call:
    inputs:
      operation:
        description: Build an alpha/draft RC or promote exact tested APK artifacts
        type: string
        required: true
      release_date:
        description: Release date in YYYY-MM-DD
        type: string
        required: true
      source_sha:
        description: Exact validated source commit
        type: string
        required: true
  workflow_dispatch:
    inputs:
      operation:
        description: Build an alpha on dev or promote exact tested APK artifacts
        type: choice
        options: [candidate, promote-test, stable]
        default: promote-test
        required: true
      release_date:
        description: Optional YYYY-MM-DD release date; otherwise derive from source/tag
        type: string
        required: false
      source_sha:
        description: Optional exact source SHA for a manual operation
        type: string
        required: false
permissions:
  contents: read
# All candidate publication and stable promotion share one writer.
concurrency:
  group: android-releases
  cancel-in-progress: false
jobs:
  candidate:
    if: inputs.operation == 'candidate' && (github.ref == 'refs/heads/dev' || (github.ref_name == inputs.release_date && github.workflow == 'Build Date Release Image'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: read
      pull-requests: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      stage: ${{ steps.version.outputs.stage }}
      release_date: ${{ steps.version.outputs.release_date }}
      source_sha: ${{ inputs.source_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Candidate checkout must match the exact source validated by the parent pipeline.
      - name: Require current source and active cycle for dated candidates
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          RELEASE_DATE: ${{ inputs.release_date }}
        run: |
          test "$SOURCE_SHA" = "$(git rev-parse HEAD)"
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)
          test "$SOURCE_SHA" = "$current"
          if [ "$GITHUB_REF_NAME" != dev ]; then
            test "$GITHUB_REF_NAME" = "$(cat release-date.txt)"
            test "$RELEASE_DATE" = "$GITHUB_REF_NAME"
          fi
      - name: Validate release policy
        run: python3 -m unittest discover -s scripts/ci -p test_android_release.py
      - name: Allocate candidate version or verify completed rerun
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          RELEASE_DATE: ${{ inputs.release_date }}
        run: |
          day=$(python3 scripts/ci/release-context.py date --sha "$SOURCE_SHA" --date "$RELEASE_DATE")
          echo "release_date=$day" >> "$GITHUB_OUTPUT"
          python3 scripts/ci/android-release.py plan --sha "$SOURCE_SHA" --day "$day" >> "$GITHUB_OUTPUT"
      - name: Require permanent maintainer signing credentials
        if: steps.version.outputs.existing != 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for variable in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "::error::Missing repository signing secret: $variable. See docs/ANDROID_RELEASES.md."
              exit 1
            fi
          done
      - uses: actions/setup-java@v6
        if: steps.version.outputs.existing != 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: steps.version.outputs.existing != 'true'
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Build release APK with candidate version
        if: steps.version.outputs.existing != 'true'
        env:
          VERSION_NAME: ${{ steps.version.outputs.tag }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          apps/android/gradlew -p apps/android --no-daemon :app:assembleRelease :tv:assembleRelease \
            "-PandroidVersionName=$VERSION_NAME" "-PandroidVersionCode=$VERSION_CODE"
      - name: Sign and verify release APK
        if: steps.version.outputs.existing != 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          keystore="$RUNNER_TEMP/android-release.keystore"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          mkdir -p "$RUNNER_TEMP/android-assets"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          for variant in app tv; do
            asset="alreadyon-android.apk"
            if [ "$variant" = tv ]; then asset="alreadyon-tv.apk"; fi
            "$tools/zipalign" -P 16 -f 4 "apps/android/$variant/build/outputs/apk/release/$variant-release-unsigned.apk" "$RUNNER_TEMP/android-aligned.apk"
            "$tools/apksigner" sign --ks "$keystore" --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
              --out "$RUNNER_TEMP/android-assets/$asset" "$RUNNER_TEMP/android-aligned.apk"
            "$tools/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/android-assets/$asset"
          done
      - name: Generate artifact-bound public inventory SBOMs
        if: steps.version.outputs.existing != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          python3 scripts/security/install-trivy.py "$RUNNER_TEMP/security-tools"
          image=$(PYTHONPATH=scripts/ci python3 -c 'import os; from image_registry import release_source; print(release_source(os.environ["GITHUB_REPOSITORY"], os.environ["SOURCE_SHA"]))')
          printf '%s' "$GH_TOKEN" | python3 scripts/security/public_inventory.py \
            --trivy "$RUNNER_TEMP/security-tools/trivy" --registry-user "$REGISTRY_USER" \
            --image "$image" --revision "$SOURCE_SHA" \
            --phone "$RUNNER_TEMP/android-assets/alreadyon-android.apk" \
            --tv "$RUNNER_TEMP/android-assets/alreadyon-tv.apk" --output "$RUNNER_TEMP/android-assets"
      - name: Publish verified APK and provenance as a prerelease
        if: steps.version.outputs.existing != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          VERSION_NAME: ${{ steps.version.outputs.tag }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          python3 scripts/ci/android-release.py candidate --sha "$SOURCE_SHA" \
            --tag "$VERSION_NAME" --version-code "$VERSION_CODE" --directory "$RUNNER_TEMP/android-assets" --require-inventory
      - name: Summarize alpha or draft RC
        env:
          CANDIDATE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_STAGE: ${{ steps.version.outputs.stage }}
          REPOSITORY: ${{ github.repository }}
        run: echo "Android $RELEASE_STAGE [$CANDIDATE_TAG](https://github.com/$REPOSITORY/releases/tag/$CANDIDATE_TAG)" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove superseded same-day beta releases after alpha verifies
        if: steps.version.outputs.stage == 'alpha'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DATE: ${{ steps.version.outputs.release_date }}
        run: python3 scripts/ci/android-release.py cleanup-legacy --repo "$GITHUB_REPOSITORY" --day "$RELEASE_DATE"
  promote_test:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/test') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/test' && inputs.operation == 'promote-test')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select tested source and release date
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          RELEASE_DATE: ${{ inputs.release_date }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            python3 scripts/ci/branch-policy.py --delivery
            source=$(sed -n 's/^selected=//p' "$GITHUB_OUTPUT" | tail -1)
          else
            source="$SOURCE_SHA"
            echo "selected=$source" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$RELEASE_DATE" ]; then
            day=$(python3 scripts/ci/release-context.py date --sha "$source" --date "$RELEASE_DATE")
          else
            day=$(python3 scripts/ci/release-context.py date-for-source --sha "$source")
          fi
          echo "release_date=$day" >> "$GITHUB_OUTPUT"
      - name: Publish the next RC using exact tested APK bytes
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.selected }}
          RELEASE_DATE: ${{ steps.source.outputs.release_date }}
        run: python3 scripts/ci/android-release.py promote-test --sha "$SOURCE_SHA" --day "$RELEASE_DATE" | tee -a "$GITHUB_STEP_SUMMARY"
  stable:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'stable')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Promote the selected tested candidate without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          RELEASE_DATE: ${{ inputs.release_date }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            python3 scripts/ci/branch-policy.py --delivery
            SOURCE_SHA=$(sed -n 's/^selected=//p' "$GITHUB_OUTPUT" | tail -1)
          fi
          if [ -n "$RELEASE_DATE" ]; then
            day=$(python3 scripts/ci/release-context.py date --sha "$SOURCE_SHA" --date "$RELEASE_DATE")
          else
            day=$(python3 scripts/ci/release-context.py date-for-source --sha "$SOURCE_SHA")
          fi
          python3 scripts/ci/android-release.py promote-stable --sha "$SOURCE_SHA" --day "$day" | tee -a "$GITHUB_STEP_SUMMARY"
