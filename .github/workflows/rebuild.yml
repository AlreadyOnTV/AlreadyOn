# Dev merges and explicit active-date dispatches publish only after full release validation.
name: Build Date Release Image
on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      revision:
        description: Optional exact commit; empty selects the dispatched dev or active dated branch
        type: string
        default: ''
      publication:
        description: Android publication after all validation gates (Stable requires explicit approval)
        type: choice
        options: [candidate, stable]
        default: candidate
      release_date:
        description: Optional YY.MM.DD release branch date; push runs derive it from the merged PR
        type: string
        required: false
permissions:
  contents: read
env:
  TZ: America/New_York
concurrency:
  group: dev-release-build
  cancel-in-progress: false
jobs:
  select:
    if: ${{ github.ref_name == 'dev' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-26.04
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      release_date: ${{ steps.source.outputs.release_date }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || (github.event_name == 'push' && github.sha) || github.ref_name }}
          persist-credentials: false
      - name: Select the exact source commit for every validation job
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DATE: ${{ inputs.release_date }}
        run: |
          if [ "${{ inputs.publication }}" = stable ]; then test "$GITHUB_REF_NAME" = dev; fi
          revision=$(git rev-parse HEAD)
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)
          test "$revision" = "$current"
          release_date=$(python3 scripts/ci/release-context.py build-date --sha "$revision" --date "$RELEASE_DATE")
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "release_date=$release_date" >> "$GITHUB_OUTPUT"
  quality:
    needs: select
    uses: ./.github/workflows/quality.yml
    with:
      revision: ${{ needs.select.outputs.revision }}
  # Dated alpha dispatches must pass semantic analysis before artifact publication.
  codeql:
    needs: select
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml
    with:
      revision: ${{ needs.select.outputs.revision }}
  bases:
    needs: select
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    concurrency:
      group: base-images
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      ci: ${{ steps.resolve.outputs.ci }}
      runtime: ${{ steps.resolve.outputs.runtime }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.select.outputs.revision }}
          persist-credentials: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/build-bases
        id: resolve
        with:
          image: ghcr.io/alreadyontv/alreadyon-base
          revision: ${{ needs.select.outputs.revision }}
  tests:
    name: Go and full browser e2e tests
    needs: [select, bases]
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.select.outputs.revision }}
          persist-credentials: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/test-source
        with:
          ci-base: ${{ needs.bases.outputs.ci }}
  publish:
    name: Build, validate and publish fresh dev release
    needs: [select, bases, quality, codeql, tests]
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    concurrency:
      group: application-images
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      statuses: write
      pull-requests: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.select.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/build-candidate
        with:
          revision: ${{ needs.select.outputs.revision }}
          ci-base: ${{ needs.bases.outputs.ci }}
          runtime-base: ${{ needs.bases.outputs.runtime }}
      - uses: ./.github/actions/security-scan
        with:
          image: alreadyon-ci:candidate
          ci-image: ${{ needs.bases.outputs.ci }}
      - name: Refuse publication from an outdated source branch tip
        env:
          GH_TOKEN: ${{ github.token }}
          CI_REVISION: ${{ needs.select.outputs.revision }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)
          test "$current" = "$CI_REVISION"
      - name: Upload tested layers without changing release channels
        id: staged
        env:
          SOURCE_IMAGE: alreadyon-ci:candidate
        run: python3 scripts/ci/stage-image.py
      - name: Export sanitized image inventory for the staged digest
        env:
          STAGED_IMAGE: ${{ steps.staged.outputs.source }}
          CI_REVISION: ${{ needs.select.outputs.revision }}
        run: |
          python3 scripts/security/image-inventory.py --report "$RUNNER_TEMP/security-report/image.json" \
            --image "$STAGED_IMAGE" --revision "$CI_REVISION" --output "$RUNNER_TEMP/image.cdx.json"
      - name: Sign build provenance for the exact tested digest
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.staged.outputs.name }}
          subject-digest: ${{ steps.staged.outputs.digest }}
      - name: Sign the image inventory for the same digest
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.staged.outputs.name }}
          subject-digest: ${{ steps.staged.outputs.digest }}
          sbom-path: ${{ runner.temp }}/image.cdx.json
      - name: Verify both signed statements before changing channels
        env:
          GH_TOKEN: ${{ github.token }}
          STAGED_IMAGE: ${{ steps.staged.outputs.source }}
        run: |
          gh attestation verify "oci://$STAGED_IMAGE" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/rebuild.yml" --source-digest "${{ needs.select.outputs.revision }}" --deny-self-hosted-runners
          gh attestation verify "oci://$STAGED_IMAGE" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/rebuild.yml" --source-digest "${{ needs.select.outputs.revision }}" --deny-self-hosted-runners --predicate-type https://cyclonedx.org/bom
      - uses: actions/upload-artifact@v7
        with:
          name: image-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image.cdx.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish nightly and overwrite today's date tag
        env:
          GH_TOKEN: ${{ github.token }}
          CI_REVISION: ${{ needs.select.outputs.revision }}
          CI_RELEASE_DATE: ${{ needs.select.outputs.release_date }}
          SOURCE_IMAGE: ${{ steps.staged.outputs.source }}
        run: |
          IMAGE_TAGS=$(CI_SOURCE_BRANCH=dev python3 scripts/ci/image-tags.py | sed -n 's/^tags=//p')
          export IMAGE_TAGS
          python3 scripts/ci/publish-image.py
      - name: Create or advance the release date tag
        env:
          GH_TOKEN: ${{ github.token }}
          CI_REVISION: ${{ needs.select.outputs.revision }}
          RELEASE_DATE: ${{ needs.select.outputs.release_date }}
        run: python3 scripts/ci/release-context.py tag --sha "$CI_REVISION" --date "$RELEASE_DATE"
      - name: Delete the merged date branch after successful release
        if: github.ref_name == 'dev' && inputs.publication != 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_REVISION: ${{ needs.select.outputs.revision }}
          RELEASE_DATE: ${{ needs.select.outputs.release_date }}
        run: python3 scripts/ci/release-context.py cleanup-branch --sha "$CI_REVISION" --date "$RELEASE_DATE"
      - name: Remove overwritten untagged versions, not closed PR tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/clean-images.py --apply --only-untagged
  android:
    name: Build and publish signed Android release after full validation
    needs: [select, quality, tests, publish]
    permissions:
      contents: write
      packages: read
      pull-requests: read
      issues: read
    uses: ./.github/workflows/android-release.yml
    with:
      operation: ${{ inputs.publication == 'stable' && 'direct-stable' || 'candidate' }}
      release_date: ${{ needs.select.outputs.release_date }}
      source_sha: ${{ needs.select.outputs.revision }}
    secrets: inherit
