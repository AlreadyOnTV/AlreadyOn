# A dev merge builds and publishes the exact date-scoped release after full validation.
name: Build Date Release Image
on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      revision:
        description: Optional dev merge commit; empty selects the current dev head
        type: string
        default: ''
      release_date:
        description: Optional YYYY-MM-DD release branch date; push runs derive it from the merged PR
        type: string
        required: false
permissions:
  contents: read
env:
  TZ: America/New_York
concurrency:
  group: dev-release-build
  cancel-in-progress: false
jobs:
  select:
    if: ${{ github.ref_name == 'dev' }}
    runs-on: ubuntu-26.04
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      release_date: ${{ steps.source.outputs.release_date }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || (github.event_name == 'push' && github.sha) || 'dev' }}
          persist-credentials: false
      - name: Select the exact dev commit for every validation job
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DATE: ${{ inputs.release_date }}
        run: |
          revision=$(git rev-parse HEAD)
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/dev" --jq .object.sha)
          test "$revision" = "$current"
          if [ -n "$RELEASE_DATE" ]; then
            release_date=$(python3 scripts/ci/release-context.py date --sha "$revision" --date "$RELEASE_DATE")
          else
            release_date=$(python3 scripts/ci/release-context.py date --sha "$revision")
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "release_date=$release_date" >> "$GITHUB_OUTPUT"
  quality:
    needs: select
    uses: ./.github/workflows/quality.yml
    with:
      revision: ${{ needs.select.outputs.revision }}
  bases:
    needs: select
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    concurrency:
      group: base-images
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      ci: ${{ steps.resolve.outputs.ci }}
      runtime: ${{ steps.resolve.outputs.runtime }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.select.outputs.revision }}
          persist-credentials: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/build-bases
        id: resolve
        with:
          image: ghcr.io/alreadyonapp/alreadyon-base
          revision: ${{ needs.select.outputs.revision }}
  tests:
    name: Go and full browser e2e tests
    needs: [select, bases]
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.select.outputs.revision }}
          persist-credentials: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/test-source
        with:
          ci-base: ${{ needs.bases.outputs.ci }}
  publish:
    name: Build, validate and publish fresh dev release
    needs: [select, bases, quality, tests]
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    concurrency:
      group: application-images
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      statuses: write
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.select.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/build-candidate
        with:
          revision: ${{ needs.select.outputs.revision }}
          ci-base: ${{ needs.bases.outputs.ci }}
          runtime-base: ${{ needs.bases.outputs.runtime }}
      - uses: ./.github/actions/security-scan
        with:
          image: alreadyon-ci:candidate
          ci-image: ${{ needs.bases.outputs.ci }}
      - name: Refuse publication from an outdated dev tip
        env:
          GH_TOKEN: ${{ github.token }}
          CI_REVISION: ${{ needs.select.outputs.revision }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/dev" --jq .object.sha)
          test "$current" = "$CI_REVISION"
      - name: Publish nightly and overwrite today's date tag
        env:
          GH_TOKEN: ${{ github.token }}
          CI_REVISION: ${{ needs.select.outputs.revision }}
          CI_RELEASE_DATE: ${{ needs.select.outputs.release_date }}
          SOURCE_IMAGE: alreadyon-ci:candidate
        run: |
          IMAGE_TAGS=$(CI_SOURCE_BRANCH=dev python3 scripts/ci/image-tags.py | sed -n 's/^tags=//p')
          export IMAGE_TAGS
          python3 scripts/ci/publish-image.py --local
      - name: Create or advance the release date tag
        env:
          GH_TOKEN: ${{ github.token }}
          CI_REVISION: ${{ needs.select.outputs.revision }}
          RELEASE_DATE: ${{ needs.select.outputs.release_date }}
        run: python3 scripts/ci/release-context.py tag --sha "$CI_REVISION" --date "$RELEASE_DATE"
      - name: Delete the merged date branch after successful release
        env:
          GH_TOKEN: ${{ github.token }}
          CI_REVISION: ${{ needs.select.outputs.revision }}
          RELEASE_DATE: ${{ needs.select.outputs.release_date }}
        run: python3 scripts/ci/release-context.py cleanup-branch --sha "$CI_REVISION" --date "$RELEASE_DATE"
      - name: Remove overwritten untagged versions, not closed PR tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/clean-images.py --apply --only-untagged
  android:
    name: Build and publish Android alpha after full validation
    needs: [select, quality, tests, publish]
    permissions:
      contents: write
      packages: read
      pull-requests: read
    uses: ./.github/workflows/android-release.yml
    with:
      operation: candidate
      release_date: ${{ needs.select.outputs.release_date }}
      source_sha: ${{ needs.select.outputs.revision }}
    secrets: inherit
