# Go extraction requires a real build; JavaScript and TypeScript use source analysis.
name: CodeQL
on:
  push:
    branches: [dev, test, main]
  pull_request:
    branches: [dev]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        description: Exact release source to analyze before publication
        required: true
        type: string
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        if: matrix.language == 'go'
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build Go source for analysis
        if: matrix.language == 'go'
        working-directory: server
        run: go build ./...
      - uses: github/codeql-action/analyze@v4
