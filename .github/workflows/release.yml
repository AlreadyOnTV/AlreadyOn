# Verify the latest tested Nightly before retagging its image and building fresh Stable APKs.
name: Publish Stable from latest Nightly
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stable-publication
  cancel-in-progress: false
jobs:
  select:
    if: github.ref_name == 'main'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    outputs:
      source_sha: ${{ steps.plan.outputs.source_sha }}
      release_date: ${{ steps.plan.outputs.release_date }}
      predecessor: ${{ steps.plan.outputs.predecessor }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Select newest validated Nightly in main history
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/android-release.py plan-latest-stable --sha "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  image:
    needs: [select, android]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      statuses: write
      attestations: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the selected image and add latest alias
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.select.outputs.source_sha }}
        run: |
          SOURCE_IMAGE=$(PYTHONPATH=scripts/ci python3 -c 'import os; from image_registry import release_source; print(release_source(os.environ["GITHUB_REPOSITORY"], os.environ["SOURCE_SHA"]))')
          python3 scripts/ci/verify-image.py --source "$SOURCE_IMAGE" --revision "$SOURCE_SHA"
          IMAGE_TAGS=$(CI_SOURCE_BRANCH=main CI_PUBLICATION=latest CI_REVISION="$SOURCE_SHA" CI_SELECTED_SHA="$SOURCE_SHA" python3 scripts/ci/image-tags.py | sed -n 's/^tags=//p')
          SOURCE_IMAGE="$SOURCE_IMAGE" CI_REVISION="$SOURCE_SHA" IMAGE_TAGS="$IMAGE_TAGS" python3 scripts/ci/publish-image.py
  android:
    needs: select
    permissions:
      contents: write
      packages: read
      pull-requests: read
      issues: read
    uses: ./.github/workflows/android-release.yml
    with:
      operation: stable
      release_date: ${{ needs.select.outputs.release_date }}
      source_sha: ${{ needs.select.outputs.source_sha }}
      predecessor: ${{ needs.select.outputs.predecessor }}
    secrets: inherit
