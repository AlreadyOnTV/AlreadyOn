# Date-release dev PRs run full source and browser e2e validation.
name: Date Release PR Validation
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: validation-${{ inputs.revision || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    with:
      revision: ${{ inputs.revision }}
  android:
    uses: ./.github/workflows/android-checks.yml
    with:
      revision: ${{ inputs.revision }}
  tests:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      # Use the production recipe: Ubuntu's stock FFmpeg 8.0.x ignores initial burst.
      # Build locally with a shared cache; untrusted PRs receive no registry credentials.
      - uses: docker/setup-buildx-action@v4
      - name: Read shared Ubuntu version
        id: ubuntu
        run: echo "version=$(sed -n 's/^ARG UBUNTU_VERSION=//p' deploy/Dockerfile)" >> "$GITHUB_OUTPUT"
      - name: Build patched media runtime for regression tests
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/base.Dockerfile
          load: true
          tags: alreadyon-validation:runtime
          build-args: |
            UBUNTU_VERSION=${{ steps.ubuntu.outputs.version }}
            FFMPEG_BUILD_JOBS=2
          cache-from: type=gha,scope=source-validation-runtime
          cache-to: type=gha,mode=max,scope=source-validation-runtime
      - name: Build local CI tooling image on the patched runtime
        run: |
          docker build --builder default \
            --file deploy/ci-base.Dockerfile \
            --target ci-base \
            --build-arg RUNTIME_BASE=alreadyon-validation:runtime \
            --tag alreadyon-validation:ci .
      - name: Go regressions and full browser e2e tests
        uses: ./.github/actions/test-source
        with:
          ci-base: alreadyon-validation:ci
          pull-base: 'false'
      - name: Build the exact PR runtime candidate
        run: |
          docker build --builder default \
            --file deploy/Dockerfile --target runtime \
            --build-arg CI_BASE=alreadyon-validation:ci \
            --build-arg RUNTIME_BASE=alreadyon-validation:runtime \
            --build-arg VCS_REF="$(git rev-parse HEAD)" \
            --build-arg BUILD_TIMESTAMP="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --tag alreadyon-ci:candidate .
      - name: Validate packaged runtime with disposable fixtures
        run: python3 tests/integration/container.py
        env:
          CONTAINER_IMAGE: alreadyon-ci:candidate
      - uses: ./.github/actions/security-scan
        with:
          image: alreadyon-ci:candidate
          ci-image: alreadyon-validation:ci
