      x-alreadyon-roles: [owner]
      operationId: createChannel
      tags: [channels]
      summary: Create a custom channel
      description: >
        The channel number must fall outside the built-in default range
        (100-199). With a `filter`, the channel's lineup is built from the
        library right away, using the same engine as the built-in channels,
        and its schedule is generated.
      requestBody:
        required: true
