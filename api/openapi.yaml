  /api/settings/metadata:
    get:
      x-alreadyon-roles: [owner]
      operationId: getMetadataSettings
      tags: [settings]
      summary: Get metadata provider settings
      description: >
        Never returns an actual key value, saved or otherwise — only
        whether a TMDb key is set, plus the opt-in flag for the no-key
        TVmaze/Wikidata fallback.
      responses:
        '200':
          description: Current status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataSettingsStatus'
    put:
      x-alreadyon-roles: [owner]
      operationId: updateMetadataSettings
      tags: [settings]
      summary: Set, replace, or clear the TMDb key; toggle the no-key fallback
      description: >
        A field left out of the request body entirely leaves that
        setting untouched. `tmdbApiKey` present as an empty string
        explicitly clears it. A non-empty value replaces it, and is
        validated for the expected shape (a JWT-shaped "API Read
        Access Token") before being saved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetadataSettingsUpdate'
      responses:
        '200':
          description: Updated status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataSettingsStatus'
        '400':
          description: A non-empty key value didn't match the expected format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/settings/media:
    get:
      x-alreadyon-roles: [owner]
      operationId: getMediaSettings
      tags: [settings]
      summary: Get the background content-polling interval
      responses:
        '200':
          description: Current setting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaSettings'
    put:
      x-alreadyon-roles: [owner]
      operationId: updateMediaSettings
      tags: [settings]
      summary: Set the background content-polling interval
      description: >
        Takes effect on the poller's next cycle without a restart. When
        a poll finds new files, the server automatically reclassifies
        genres/enriches metadata and rebuilds default channel lineups
        (the same pipeline as POST /api/admin/refresh-schedule).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaSettings'
      responses:
        '200':
          description: Saved setting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaSettings'
        '400':
          description: Unlisted interval value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/settings/folders/browse:
    get:
      x-alreadyon-roles: [owner]
      operationId: browseFolders
      tags: [settings]
      summary: List server folders for the media folder picker
      description: Requires authentication. Lists directories and directory symlinks readable by the server, without returning file contents. Paths use the server filesystem (the container filesystem when deployed in Docker).
      parameters:
        - in: query
          name: path
          schema:
            type: string
            default: /data/media/
          description: Absolute directory path. Omit to start at /data/media/.
      responses:
        '200':
          description: Current folder, parent (empty at root), and alphabetically sorted subfolders
          content:
            application/json:
              schema:
                type: object
                required: [path, parent, folders]
                properties:
                  path: { type: string }
                  parent: { type: string }
                  folders:
                    type: array
                    items:
                      type: object
                      required: [name, path]
                      properties:
                        name: { type: string }
                        path: { type: string }
        '400':
          description: Invalid path or not a directory
        '401':
          description: Sign in required
        '403':
          description: Folder is not readable by the server
        '404':
          description: Folder does not exist
  /api/settings/folders:
    get:
      x-alreadyon-roles: [owner]
      operationId: getFolderSettings
      tags: [settings]
      summary: Content folders and scan exclusions
      description: >
        The folders the library scanner reads (TV shows, movies,
        commercials) and the glob patterns it skips. Until an admin saves
        a list, its built-in default applies (`/data/media/tv_shows`,
        `/data/media/movies`, `/data/media/commercials`); `source` says
        which. Each path carries a live status. The scanner reads the
        union of the TV and movie folders.
      responses:
        '200':
          description: Effective settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderSettings'
    put:
      x-alreadyon-roles: [owner]
      operationId: updateFolderSettings
      tags: [settings]
      summary: Save content folders and scan exclusions
      description: >
        Every field is optional. An array saves that list (an empty array
        means none), `null` resets it to the built-in default, and an
        absent field is left unchanged. Paths must be absolute; they are
        cleaned and de-duplicated. Patterns are `filepath.Match` globs
        matched against file and directory base names. Folders that don't
        exist yet are accepted and reported as `notFound`. A change starts
        a background rescan (files under removed folders or matching new
        patterns become missing; new files are picked up); progress shows
        in `GET /api/status/startup`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FolderSettingsUpdate'
      responses:
        '200':
          description: Saved, effective settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderSettings'
        '400':
          description: Invalid path, pattern, or too many entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/settings/transcoding/test:
    post:
      x-alreadyon-roles: [owner]
      operationId: testTranscoding
      tags: [settings]
      summary: Try a Transcoding choice on this host
      description: >
        Encodes a second of synthetic video with the named encoder and reports
        whether it worked. With `decoding` true it instead decodes a synthetic
        H.264 clip on that GPU (needs a hardware `transcoding` choice; nothing
        is cached and streams do not use hardware decoding yet). A hardware choice is used for streams only while this
        test (run automatically, then every ten minutes; a failure is retried
        after a minute) passes; otherwise streams use software. The host drivers
        and the device (for example `/dev/dri`) must already be in place.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [transcoding]
              properties:
                transcoding:
                  type: string
                  enum: [software, intel, nvidia-nvenc, amd-vaapi]
                decoding:
                  type: boolean
                  description: Test hardware decoding instead of encoding. Default false.
      responses:
        '200':
          description: The result (a failed test is still 200, with ok false)
          content:
            application/json:
              schema:
                type: object
                properties:
                  encoder: { type: string }
                  device: { type: string, description: The DRI render node used, if any. }
                  ok: { type: boolean }
                  detail: { type: string, description: What happened and the likely cause. }
        '400':
          description: Not one of the allowed choices
        '503':
          description: Hardware testing is not available

  /api/settings/transcoding/threads:
    get:
      x-alreadyon-roles: [owner]
      operationId: getTranscodeThreads
      tags: [settings]
      summary: The measured CPU thread count for transcodes
      description: >
        The server times a demanding test conversion (2160p HDR10 to 1080p on
        the CPU) with 2, 4, 8, 16 and 32 threads, at startup and whenever the
        encoder or hardware decoding setting changes, and uses the smallest
        count within 10% of the fastest as the decoder and tone mapping thread
        count of every conversion. The counts tried are capped at the CPU count
        divided by the allowed simultaneous conversions. Speeds are multiples of
        real time.
      responses:
        '200':
          description: Current count and the last measurement
          content:
            application/json:
              schema:
                type: object
                properties:
                  threads: { type: integer, description: Used by every conversion; 2 until measured. }
                  state: { type: string, enum: [idle, running] }
                  measuredAt: { type: string, format: date-time, nullable: true }
                  cpus: { type: integer }
                  workload: { type: string }
                  samples:
                    type: array
                    nullable: true
                    items:
                      type: object
                      properties:
                        threads: { type: integer }
                        speed: { type: number }
                  detail: { type: string, description: Why a measurement was skipped or failed, or that the server cannot keep up in real time. }
        '503':
          description: Thread tuning is not available

  /api/settings/transcoding/threads/tune:
    post:
      x-alreadyon-roles: [owner]
      operationId: tuneTranscodeThreads
      tags: [settings]
      summary: Measure the CPU thread count now
      description: >
        Starts a measurement even while streams play (a measurement uses the
        whole CPU for up to half a minute). Answers 202 with the status; poll
        `GET /api/settings/transcoding/threads` for the result. Does nothing if
        one is already running.
      responses:
        '202':
          description: Measuring
        '503':
          description: Thread tuning is not available

  /api/settings/transcoding/capacity:
    get:
      x-alreadyon-roles: [owner]
      operationId: getServerCapacity
      tags: [settings]
      summary: What this server measured about its own encoding speed
      description: >
        The server times software conversions of a 1080p60 test video at
        1080p60, 1080p30, 720p60, 720p30, 480p30 and 360p30 (best first, stopping
        at the first that runs at least 1.3 times real time), at startup, when the
        encoder setting changes and every hour at :30. The result is stored, so
        every viewer shares it: Auto quality never goes above the largest size
        that passed. A hardware encoder is measured at 1080p30 only and has no
        SDR size limit. Separate process-local HDR measurements use 2160p24, 2160p30 and 2160p60 Main 10
        fixtures through decode, scale, tone map, encode and HLS mux at 1080p30,
        720p30, 480p30 and 360p30, also trying 1080p60 and 720p60 for 60fps sources.
        Film-rate sources use 24fps output. PQ and HLG are tested independently. HDR limits
        apply only to Auto, matching encoder/decoder/thread settings, HEVC Main 10 source sizes
        up to 2160p60, and results less than two hours old. Explicit quality is
        preserved. HDR measurements run off the request path and are cancelled
        when automatic measurement encounters playback. They are not persisted.
        The number of parallel conversions is worked out from that
        speed, the CPU count and the free memory at startup and every hour at :15
        (unless an administrator picks a number in the playback settings).
      responses:
        '200':
          description: The last measurement and the detected limits
          content:
            application/json:
              schema:
                type: object
                properties:
                  state: { type: string, enum: [idle, running] }
                  measuredAt: { type: string, format: date-time, nullable: true }
                  encoder: { type: string, description: The encoder measured; empty is software. }
                  samples:
                    type: array
                    nullable: true
                    items:
                      type: object
                      properties:
                        height: { type: integer }
                        fps: { type: number }
                        speed: { type: number, description: Times real time. }
                  hdr:
                    type: array
                    description: Complete HDR pipeline measurements; absent until measured this process.
                    items:
                      type: object
                      properties:
                        encoder: { type: string }
                        sourceFps: { type: number }
                        hardwareDecode: { type: boolean }
                        transfer: { type: string, enum: [smpte2084, arib-std-b67] }
                        toneMapper: { type: string, enum: [gpu, cpu] }
                        threads: { type: integer }
                        measuredAt: { type: string, format: date-time }
                        samples:
                          type: array
                          items:
                            type: object
                            properties:
                              height: { type: integer }
                              fps: { type: number }
                              speed: { type: number }
                  maxHeight: { type: integer, description: Largest software height sustained; 0 means no limit. }
                  maxFps: { type: number }
                  processes: { type: integer, description: Detected parallel conversions; 0 until known. }
                  processesAt: { type: string, format: date-time, nullable: true }
                  cpus: { type: integer }
                  detail: { type: string }
        '503':
          description: Capacity measurement is not available

  /api/settings/transcoding/capacity/measure:
    post:
      x-alreadyon-roles: [owner]
      operationId: measureServerCapacity
      tags: [settings]
      summary: Measure the server's encoding speed now
      description: >
        Starts a measurement even while streams play. Answers 202 with the
        status; poll `GET /api/settings/transcoding/capacity` for the result.
        Does nothing if one is already running.
      responses:
        '202':
          description: Measuring
        '503':
          description: Capacity measurement is not available

  /api/server/restart:
    post:
      x-alreadyon-roles: [owner]
      operationId: restartServer
      tags: [settings]
      summary: Restart the server process
      description: >
        Answers 202, then shuts down cleanly (listeners, streams, database) and
        starts the same binary again in the same process, so a container keeps
        running. Viewers are interrupted for a few seconds and the startup
        library scan runs again. Environment variables are re-read from the
        unchanged process environment, so compose file changes still need the
        container recreated. Needs the same authentication as other settings.
      responses:
        '202':
          description: Restarting
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [restarting] }

  /api/settings/server:
    get:
      x-alreadyon-roles: [owner]
      operationId: getServerSettings
      tags: [settings]
      summary: Transcoding, TLS, ACME and DDNS choices
      description: >
        The Server tab's choices. `transcoding` is in use (see
        /api/settings/transcoding/test); TLS/ACME are activated through dedicated TLS endpoints and DDNS through its provider endpoint. Legacy preferences do not activate certificates.
      responses:
        '200':
          description: Current settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerSettings'
    put:
      x-alreadyon-roles: [owner]
      operationId: updateServerSettings
      tags: [settings]
      summary: Save Server tab choices
      description: >
        Every field is optional; an absent field is left unchanged.
        Unknown fields (for example credentials) are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServerSettings'
      responses:
        '200':
          description: Saved settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerSettings'
        '400':
          description: A value is not one of the allowed choices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/profiles:
    get:
      x-alreadyon-roles: [owner, viewer]
      operationId: listProfiles
      tags: [profiles]
      summary: List profiles
      description: >
        The signed-in account's profiles, shared by all of its clients. A new
        account has an Admin, a Teen and a Kids profile, none with a PIN. The
        list is ordered admin profiles first, then Unrestricted, Teen and Kids
        audiences, then creation order. A PIN or its hash is never returned,
        only `hasPin`. An owner can list
        another account's profiles with `userId`.

        Profiles are not accounts: the account is the authorization boundary,
        and a profile's role and audience tier are content filters within it.
      parameters:
        - $ref: '#/components/parameters/ProfileUserId'
      responses:
        '200':
          description: Profiles, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Profile'
    post:
      x-alreadyon-roles: [owner, viewer]
      operationId: createProfile
      tags: [profiles]
      summary: Create a profile
      description: >
        Starts with no PIN and no stored preferences. Set a PIN with
        `PUT /api/profiles/{id}/pin`. Created on the signed-in account, or for
        an owner on the account named by `userId`. An account has at most 12
        profiles.
      parameters:
        - $ref: '#/components/parameters/ProfileUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileDraft'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: Invalid name, role, or audience tier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: A viewer named another account in `userId`
        '409':
          description: >
            Another profile of the account already has that name
            (case-insensitive), or the account has the maximum number of
            profiles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/profiles/{id}:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    get:
      x-alreadyon-roles: [owner, viewer]
      operationId: getProfile
      tags: [profiles]
      summary: Get one profile
      responses:
        '200':
          description: The profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '404':
          description: No profile with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      x-alreadyon-roles: [owner, viewer]
      operationId: updateProfile
      tags: [profiles]
      summary: Change some fields of a profile
      description: >
        Only the fields present in the body change, so two devices editing
        different fields don't overwrite each other. A preference set to
        `null` is cleared back to the client default. `icon` accepts a
        preset id or `null`; custom images go through
        `POST /api/profiles/{id}/icon`. Choosing another icon deletes a
        previously uploaded one. PINs are not part of this body. The last
        admin can't be demoted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatch'
      responses:
        '200':
          description: The updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: Unknown field or invalid value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No profile with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Duplicate name, or this would leave no admin profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      x-alreadyon-roles: [owner, viewer]
      operationId: deleteProfile
      tags: [profiles]
      summary: Delete a profile
      description: The last admin profile can't be deleted. An uploaded icon file is removed too.
      responses:
        '204':
          description: Deleted
        '404':
          description: No profile with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: This is the last admin profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/profiles/{id}/pin:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    put:
      x-alreadyon-roles: [owner, viewer]
      operationId: setProfilePin
      tags: [profiles]
      summary: Set or change a profile's PIN
      description: >
        The PIN (4-6 digits) is stored as a bcrypt hash and never returned
        or logged. Setting one also clears any failed-attempt lockout.
        Until sessions exist this does not require the old PIN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin:
                  type: string
                  pattern: '^[0-9]{4,6}$'
      responses:
        '204':
          description: PIN stored
        '400':
          description: Not 4-6 digits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No profile with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      x-alreadyon-roles: [owner, viewer]
      operationId: clearProfilePin
      tags: [profiles]
      summary: Remove a profile's PIN
      description: >
        Also serves as the admin reset for a forgotten PIN, since no
        session distinguishes an admin from the profile's own user yet.
      responses:
        '204':
          description: PIN removed
        '404':
          description: No profile with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/profiles/{id}/verify-pin:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    post:
      x-alreadyon-roles: [owner, viewer]
      operationId: verifyProfilePin
      tags: [profiles]
      summary: Check a PIN
      description: >
        Reports whether the PIN matches; a profile without a PIN always
        verifies. It grants nothing (there are no sessions yet). Wrong
        PINs back off per profile: the third consecutive failure locks the
        profile for 5 seconds, doubling with each further failure up to 15
        minutes. While locked, even the correct PIN is refused without
        being compared. A success resets the count.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin:
                  type: string
      responses:
        '200':
          description: The PIN matches
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
        '401':
          description: The PIN is wrong
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  error:
                    type: string
        '404':
          description: No profile with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Locked after repeated wrong PINs; see the Retry-After header
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until another attempt is accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  error:
                    type: string
                  retryAfterSeconds:
                    type: integer

  /api/profiles/{id}/icon:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    post:
      x-alreadyon-roles: [owner, viewer]
      operationId: uploadProfileIcon
      tags: [profiles]
      summary: Upload a custom profile icon
      description: >-
        Multipart upload (form field `file`, at most 1 MB) of a PNG, JPEG,
        GIF, or WebP image, sniffed from its content. It is stored as a
        file and the profile's `icon` becomes its URL. The web app sends a
        128x128 PNG. A previously uploaded icon is deleted.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: The updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: Missing file, too large, or not a supported image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No profile with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/admin/refresh-schedule:
    post:
      x-alreadyon-roles: [owner]
      operationId: refreshSchedule
      tags: [admin]
      summary: Reclassify genres/ratings and rebuild every filtered channel's lineup
      description: >
        Uses each provider's effective key (Web UI value, falling back to
        a mirrored environment variable). Rebuilds every channel that has
        a filter (all built-in channels, and custom channels with a
        filter) from scratch, including ones already populated —
        an explicit, on-demand action, unlike the automatic
        startup-only population. Channels without a filter are never
        touched.
      responses:
        '200':
          description: Summary of what ran
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshScheduleResult'
        '409':
          description: >
            A refresh (or the startup library pipeline) is already running;
            retry once it finishes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/admin/refresh-times:
    get:
      x-alreadyon-roles: [owner]
      operationId: getRefreshTimes
      tags: [admin]
      summary: When the library was last scanned and the schedules last regenerated
      description: Counts every trigger (the manual buttons, startup, polling and the hourly schedule top-up). A time is null when it has never happened.
      responses:
        '200':
          description: The two times
          content:
            application/json:
              schema:
                type: object
                properties:
                  mediaRefreshedAt: { type: [string, 'null'], format: date-time }
                  scheduleRefreshedAt: { type: [string, 'null'], format: date-time }
  /api/admin/refresh-media:
    post:
      x-alreadyon-roles: [owner]
      operationId: refreshMedia
      tags: [admin]
      summary: Rescan the media folders now
      description: >
        The Media tab's Refresh Media button. Scans every configured folder
        (new files are added, deleted ones leave the guide), then runs the
        same pipeline as a folder change. The optional `profileId` only
        labels the server log entry (`manual media refresh requested by
        profile ...`); it is not an authorization check. The scan is not
        cancelled if the client disconnects.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                profileId:
                  type: integer
                  format: int64
      responses:
        '200':
          description: The scan finished
          content:
            application/json:
              schema:
                type: object
                required: [filesAdded, filesMissing]
                properties:
                  filesAdded:
                    type: integer
                  filesMissing:
                    type: integer
        '400':
          description: Unknown `profileId`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: A refresh or scan is already running; retry once it finishes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/admin/api-keys:
    get:
      x-alreadyon-roles: [owner]
      operationId: listApiKeys
      tags: [admin]
      summary: List generated API keys
      description: >
        Never returns a raw or hashed key value, only what's needed to
        identify and revoke one. All management API operations require
        a valid bearer key. Initial provisioning uses the local access-key CLI.
      responses:
        '200':
          description: Every generated key, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKey'
    post:
      x-alreadyon-roles: [owner]
      operationId: createApiKey
      tags: [admin]
      summary: Generate a new API key
      description: >
        The response's "key" field is the only time the raw key is ever
        returned — copy it now; it can't be retrieved again afterward.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        '201':
          description: The new key, including its one-time raw value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreated'
        '400':
          description: Missing/blank name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/admin/api-keys/{id}:
    delete:
      x-alreadyon-roles: [owner]
      operationId: revokeApiKey
      tags: [admin]
      summary: Permanently revoke an API key
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Revoked
        '404':
          description: No API key with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/settings/playback:
    get:
      x-alreadyon-roles: [owner]
      operationId: getPlaybackSettings
      tags: [settings]
      summary: Get playback resource limits
      responses:
        '200':
          description: Limits consumed by the stream manager when it is connected to playback routes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackSettings'
    put:
      x-alreadyon-roles: [owner]
      operationId: putPlaybackSettings
      tags: [settings]
      summary: Replace playback resource limits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaybackSettings'
      responses:
        '200':
          description: Saved limits; lowering limits prevents new admission without interrupting existing viewers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackSettings'
        '400':
          description: Missing, unknown or out-of-range setting
        '500':
          description: Settings could not be saved

  /api/channels/{id}/commercials:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      x-alreadyon-roles: [owner]
      operationId: getChannelCommercials
      tags: [channels]
      summary: Read commercial overrides and effective settings for one channel
      responses:
        '200':
          description: Saved overrides plus current inheritance and removed-folder fallback
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelCommercialPolicy' }
        '401': { description: Authentication required }
        '404': { description: Unknown channel }
    put:
      x-alreadyon-roles: [owner]
      operationId: putChannelCommercials
      tags: [channels]
      summary: Replace commercial overrides and refresh this channel's future schedule
      description: >
        The currently airing entry is retained. Future ads disabled or excluded by
        this policy are removed, including pending rotation-checkpoint ads. Break
        timing, size and volume remain global. Omitting enabled inherits; omitting
        folders selects all. A removed saved folder causes the entire folder
        selection to fall back to all currently configured commercial folders.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChannelCommercialSettings' }
      responses:
        '200':
          description: Saved and future schedule refreshed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelCommercialPolicy' }
        '400': { description: Unknown field or folder outside the configured commercial folder list }
        '401': { description: Authentication required }
        '404': { description: Unknown channel }
        '500': { description: Save or schedule refresh failed; a refresh failure may follow a successful settings save }

  /api/playback/sessions:
    post:
      x-alreadyon-roles: [owner, viewer]
      operationId: issuePlaybackSession
      tags: [playback]
      summary: Issue a five-minute authorization scoped to one channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channelId]
              properties:
                channelId:
                  type: integer
                  minimum: 1
      responses:
        '201':
          description: Scoped authorization; the raw token is returned once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackSession'
        '401':
          description: Invalid management credential or issuance unavailable
        '404':
          description: Unknown channel
    delete:
      x-alreadyon-roles: [owner, viewer]
      operationId: revokePlaybackSession
      tags: [playback]
      summary: Revoke an owned playback authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channelId, token]
              properties:
                channelId:
                  type: integer
                token:
                  type: string
      responses:
        '204':
          description: Revoked
        '401':
          description: Invalid or unowned session

  /api/playback/probe:
    post:
      x-alreadyon-roles: [owner, viewer]
      operationId: issueNetworkProbe
      tags: [playback]
      summary: Issue a token scoped to network probes on media channel zero
      responses:
        '201':
          description: Five-minute probe token with a 32 MiB total response budget
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackSession'
        '401':
          description: Unauthorized

  /media/{channel}/probe:
    servers:
      - url: https://localhost:19900
    get:
      x-alreadyon-roles: [owner, viewer]
      operationId: probeMediaConnection
      tags: [playback]
      security:
        - PlaybackToken: []
      parameters:
        - name: channel
          in: path
          required: true
          schema:
            type: integer
        - name: bytes
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 8388608
            default: 1
      responses:
        '200':
          description: Uncached random bytes; ten-second response write deadline
          content:
            application/octet-stream: {}
        '400':
          description: Invalid byte count
        '401':
          description: Missing, expired, revoked or wrong-channel authorization
        '403':
          description: Origin not allowed
        '429':
          description: Probe byte budget exhausted

  /api/settings/playback/delivery:
    get:
      x-alreadyon-roles: [owner]
      operationId: getPlaybackDelivery
      tags: [settings]
      responses:
        '200':
          description: Advertised media origin and allowed browser origins
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackDelivery'
    put:
      x-alreadyon-roles: [owner]
      operationId: putPlaybackDelivery
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaybackDelivery'
      responses:
        '200':
          description: Saved settings
        '400':
          description: Invalid origin or unknown field

  /api/channels/{id}/tune:
    post:
      x-alreadyon-roles: [owner, viewer]
      operationId: tuneChannel
      tags: [playback]
      summary: Select direct play or a shared HLS rendition at the current schedule offset
      parameters:
        - $ref: '#/components/parameters/ChannelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [capabilities]
              properties:
                capabilities:
                  $ref: '#/components/schemas/PlaybackCapabilities'
                profileId:
                  type: integer
                  format: int64
                  description: Selected viewer profile. A successful tune commits its lastWatchedChannelId before responding. Omit for legacy clients without profiles; no profile is updated then.
                entryStartsAt:
                  type: string
                  format: date-time
                  description: Optional exact start of current or next entry; prepare at most eight seconds early. Does not change the schedule.
                token:
                  type: string
                  description: Optional unused channel authorization issued before tuning, allowing cancellation while startup is pending. One tune per token.
                audioLanguage:
                  type: string
                  default: en
                  maxLength: 32
                  description: Preferred audio language; falls back to the default track, then the first audio track.
                audioTrackIndex:
                  type: integer
                  description: Explicit source stream index, scoped to audioMediaFileId; overrides the language for that file only.
                audioMediaFileId:
                  type: integer
                  format: int64
                  description: Required with audioTrackIndex. A different scheduled file uses language selection instead.
                forceEncode:
                  type: boolean
                  default: false
                maxHeight:
                  type: integer
                  enum: [0, 360, 480, 720, 1080, 2160]
                  default: 0
                  description: Viewer's quality ceiling in lines. 0 is automatic. A source taller than the ceiling is always converted; the plan's bitrate is capped for the chosen height. 2160 (4K) is planned only while a hardware encoder is in use and the client reports 4K H.264 decoding; otherwise the stream stays at 1080p.
      responses:
        '201':
          description: Scoped media URL and authoritative timeline; poll status until ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TunedPlayback'
        '401':
          description: Invalid server access key
        '404':
          description: Unknown profile or no scheduled content
        '409':
          description: Schedule changed while preparing playback; retry
        '429':
          description: >
            The account is already watching on as many other devices as its
            simultaneous-stream limit allows (code `stream_limit`). A stream
            frees when its device stops playback or within five minutes of the
            device going away. Retrying immediately will not help.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Missing/corrupt source or no compatible output within bandwidth. Error body also supplies retryAt (entry end) and serverTime for recovery at the next boundary. Confirmed absent files use source_missing; unreadable, corrupt or out-of-library sources use source_unavailable. Planning failures include code playback_incompatible, or client_codec_unsupported when reported baseline browser capabilities are absent. Missing FFmpeg decoders use native_server_decoder_missing outside the official image, or server_decoder_missing in the packaged runtime, with missingCodecs naming the unavailable source decoders. Only native failures offer local server package installation guidance; client codec installation cannot fix either server error. Codes are optional for other 422 failures.
        '503':
          description: Capacity exhausted or playback unavailable; retry. Stream admission limits include code stream_capacity and Retry-After 1; unrelated failures omit that code.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  code: { type: string, enum: [stream_capacity] }

  /api/playback/status:
    post:
      x-alreadyon-roles: [owner, viewer]
      operationId: playbackStatus
      tags: [playback]
      summary: Renew the viewer lease and five-minute token expiry; retrieve readiness and server time
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channelId, token]
              properties:
                channelId:
                  type: integer
                token:
                  type: string
      responses:
        '200':
          description: Current session state; this does not extend token expiry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TunedPlayback'
        '401':
          description: Invalid or unowned token
        '410':
          description: Worker stopped or viewer lease expired; tune again

  /media/{channel}/source:
    servers:
      - url: https://localhost:19900
    get:
      x-alreadyon-roles: [owner, viewer]
      operationId: directPlaybackSource
      tags: [playback]
      security:
        - PlaybackToken: []
      parameters:
        - $ref: '#/components/parameters/MediaChannel'
      responses:
        '200':
          description: Authorized source file for this session
        '206':
          description: Single byte range for browser seeking
        '401':
          description: Missing, expired, revoked or wrong-channel token
        '404':
          description: Unavailable source, removed root or incompatible playback mode
        '410':
          description: Viewer lease expired
        '416':
          description: Unsatisfiable or multiple ranges

  /media/{channel}/index.m3u8:
    servers:
      - url: https://localhost:19900
    get:
      x-alreadyon-roles: [owner, viewer]
      operationId: playbackManifest
      tags: [playback]
      security:
        - PlaybackToken: []
      parameters:
        - $ref: '#/components/parameters/MediaChannel'
      responses:
        '200':
          description: HLS playlist whose segment URLs carry this short-lived token
          content:
            application/vnd.apple.mpegurl: {}
        '401':
          description: Invalid authorization
        '410':
          description: Stream stopped
        '503':
          description: Stream starting; Retry-After is one second

  /media/{channel}/subtitles/{index}:
    servers:
      - url: https://localhost:19900
    get:
      x-alreadyon-roles: [owner, viewer]
      operationId: playbackSubtitles
      tags: [playback]
      security:
        - PlaybackToken: []
      summary: One text subtitle track as cues in source-file time
      description: >
        Extracted in the background, at most two at a time. 202 with
        Retry-After means it is still being prepared (a large remux can take
        minutes); poll until 200. Cue times are seconds in the source file, so
        a client maps them with the entry's sourceOffsetSeconds and stream
        offsets.
      parameters:
        - $ref: '#/components/parameters/MediaChannel'
        - name: index
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Cues, sorted by start time
          content:
            application/json:
              schema:
                type: object
                properties:
                  cues:
                    type: array
                    items:
                      type: object
                      properties:
                        s: { type: number }
                        e: { type: number }
                        t: { type: string }
        '202':
          description: Still being prepared
        '401':
          description: Invalid authorization
        '404':
          description: Not a text subtitle track of this stream
        '500':
          description: Extraction failed; retried after a pause

  /media/{channel}/{segment}:
    servers:
      - url: https://localhost:19900
    get:
      x-alreadyon-roles: [owner, viewer]
      operationId: playbackSegment
      tags: [playback]
      security:
        - PlaybackToken: []
      parameters:
        - $ref: '#/components/parameters/MediaChannel'
        - name: segment
          in: path
          required: true
          schema:
            type: string
            pattern: '^segment-[0-9]{9}\.ts$'
      responses:
        '200':
          description: Authorized MPEG-TS segment
          content:
            video/mp2t: {}
        '401':
          description: Invalid authorization
        '404':
          description: Invalid name or expired segment
        '410':
          description: Stream stopped

  /api/channel-filter-options:
    get:
      x-alreadyon-roles: [owner]
      summary: List shared age restrictions and eras
      responses:
        '200': { description: Catalog keyed by age, era with arrays of definitions }
  /api/channel-filter-options/{kind}/{id}:
    parameters:
      - in: path
        name: kind
        required: true
        schema: { type: string, enum: [age, era] }
      - in: path
        name: id
        required: true
        schema: { type: string }
    put:
      x-alreadyon-roles: [owner]
      summary: Save shared definition and rebuild pools and schedules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                id: { type: string }
                name: { type: string, maxLength: 100 }
                ratings: { type: array, items: { type: string } }
                unrestricted: { type: boolean, description: Legacy bypass of all rating checks }
                defaultPosition: { type: integer, readOnly: true, description: Stable default display order }
                allowUnknown: { type: boolean, description: Allow missing or unrecognized ratings independently of selected known ratings }
                startYear: { type: integer, minimum: 0, maximum: 9999 }
                endYear: { type: integer, minimum: 0, maximum: 9999 }
      responses:
        '200': { description: Saved }
        '400': { description: Invalid definition }
    delete:
      x-alreadyon-roles: [owner]
      summary: Delete an unused definition
      responses:
        '200': { description: Deleted }
        '400': { description: Referenced by a channel or missing }
  /api/library/items/{id}/tmdb:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    post:
      x-alreadyon-roles: [owner]
      summary: Apply a direct TMDb movie or show ID and rebuild schedules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tmdbId]
              properties:
                tmdbId: { type: integer, minimum: 1 }
      responses:
        '200': { description: Updated file count; TV updates all episodes in the selected show }
        '400': { description: Invalid ID or lookup failed or missing token }
        '404': { description: Library item not found }

  /api/channel-filter-options/{kind}/restore-order:
    post:
      x-alreadyon-roles: [owner]
      summary: Restore only the display order of a filter definition list
      parameters:
        - in: path
          name: kind
          required: true
          schema: { type: string, enum: [age, era] }
      responses:
        '204': { description: Default display order restored; definitions unchanged }
        '400': { description: Invalid filter kind }
  /api/channel-filter-options/{kind}/{id}/move:
    parameters:
      - in: path
        name: kind
        required: true
        schema: { type: string, enum: [age, era] }
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      x-alreadyon-roles: [owner]
      summary: Move a shared definition up or down in display order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [direction]
              properties:
                direction: { type: string, enum: [up, down, target] }
                target: { type: string, description: Existing option ID whose display position becomes the moved row position }
      responses:
        '204': { description: Order persisted }
        '400': { description: Invalid ID or direction }
  /api/settings/loudness:
    get:
      x-alreadyon-roles: [owner]
      summary: Read loudness analysis settings and progress
      responses:
        '200':
          description: >-
            Enabled/running flags, currentFile, active (files being measured now), workers (how many the load governor currently allows), cpuPercent (sampled host CPU execution, excluding disk wait), limitedBy (cpu, disk, ram, network, swap, playback, recovery, metrics or empty: pressure, foreground HDR playback, recovery or unavailable metrics holding background work), ready/pending/skipped/failed file counts and lastError. Disabled by default.
    put:
      x-alreadyon-roles: [owner]
      summary: Enable or disable background loudness measurement and server-side playback normalization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              additionalProperties: false
              properties:
                enabled: { type: boolean, default: false }
      responses:
        '200': { description: Updated settings and progress. Disabling cancels active analysis; new playback uses original audio. }
        '400': { description: Missing or invalid enabled field }
  /api/settings/loudness/run:
    post:
      x-alreadyon-roles: [owner]
      summary: Queue outstanding media and retry failed loudness analyses
      responses:
        '200': { description: Run requested; completed unchanged files reuse stored measurements }
        '409': { description: Loudness Detection is disabled }
  /api/server/details:
    get:
      x-alreadyon-roles: [owner, viewer]
      summary: Get server process and image build details
      responses:
        '200':
          description: Authenticated server identity; host IPs are empty when unavailable in a container
          content:
            application/json:
              schema:
                type: object
                required: [serverName, uptimeSeconds, ipAddresses, appVersion, timeZone, ffmpegVersion]
                properties:
                  serverName: { type: string, description: Configured server display name }
                  uptimeSeconds: { type: integer, minimum: 0, description: Seconds since app process initialization }
                  ipAddresses:
                    {
                      type: array,
                      items: { type: string },
                      description: All discovered IPv4 server-interface addresses including loopback and virtual interfaces; excludes IPv6,
                    }
                  appVersion:
                    {
                      type: string,
                      description: 'Build identity in America/New_York (YY.MM.DD_shortsha); Development_shortsha when native build metadata is unavailable. Release-cycle labels separately use YY.MM.DD',
                    }
                  timeZone: { type: string }
                  ffmpegVersion: { type: string, description: Installed FFmpeg version or Unavailable }
        '401': { description: Authentication required }
  /api/server/metrics:
    get:
      x-alreadyon-roles: [owner, viewer]
      summary: Server CPU, RAM, disk and bandwidth history
      parameters:
        - in: query
          name: minutes
          schema: { type: integer, default: 15, enum: [15, 30, 60, 120, 240, 720] }
      responses:
        '200':
          description: >
            intervalSeconds, averaged points and current sample. Unavailable readings
            are null, never zero. cpu is the mean utilization of the cgroup cpuset's
            logical CPUs; cpuCores lists {core, utilization} per logical CPU. cpuLoad
            is the one-minute load average; cpuPressure and ioPressure are Linux PSI
            "some avg10" percentages (host-wide). ram is memoryUsedBytes divided by
            memoryLimitBytes; memoryLimited is false when no container limit applies
            and memoryLimitBytes is host RAM. diskReadMBps/diskWriteMBps are decimal
            MB/s from the container cgroup (diskScope container) or whole physical
            disks (diskScope server). diskUsedBytes/diskTotalBytes describe diskPath,
            the data directory; mediaUsedBytes/mediaTotalBytes sum the configured media
            folders' distinct filesystems; disk is used/total percent across all of
            those filesystems. ingressMbps/egressMbps
            are nullable decimal Mbps with networkInterface and networkScope; a fresh
            host helper supplies only network readings. Points carry cpu, cpuCores, ram,
            disk throughput, ioPressure and network averages; capacity, limit, load and
            CPU pressure fields are populated on current. Samples are collected every
            second; historical averages are cached for up to 15 seconds and current
            readings stay fresh.
        '400': { description: Unsupported window }
  /api/server/activity:
    get:
      x-alreadyon-roles: [owner, viewer]
      operationId: getServerActivity
      tags: [admin]
      summary: Active viewers and background processes
      description: >
        Authenticated read-only, no-store snapshot available to owner and viewer accounts. Viewers publish the entry
        actually attached to their player, never prefetched entries. Commercials
        retain the preceding program and freeze its readings. A viewer joining
        during a commercial is hidden until a program plays. Reports expire after
        35 seconds; ended streams have at most a 10-second transition grace. Reading
        this endpoint never renews playback leases. Profiles and client latency
        are client-reported; source IP is the connected peer (forwarded headers
        are not trusted). No device hostname is inferred from browser identity.
      responses:
        '200':
          description: Current activity
          content:
            application/json:
              schema:
                type: object
                required: [sessions, processes]
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/ActiveViewer'
                  processes:
                    type: array
                    items:
                      $ref: '#/components/schemas/ActiveProcess'
        '401':
          description: Authentication required
  /api/playback/activity:
    post:
      x-alreadyon-roles: [owner, viewer]
      operationId: reportPlaybackActivity
      tags: [status]
      summary: Report the entry actually displayed by a player
      description: >
        Best-effort telemetry, normally every five seconds and on entry changes.
        Requires an existing playback session owned by the authenticated principal.
        Does not renew playback authorization or leases. The random per-player
        viewerId survives program/commercial transitions but is not persisted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [viewerId, channelId, token]
              properties:
                viewerId: { type: string, minLength: 16, maxLength: 80 }
                token: { type: string }
                channelId: { type: integer, format: int64 }
                profileId: { type: integer, format: int64, description: Selected profile; zero means unknown }
                latencyMs:
                  {
                    type: [number, 'null'],
                    minimum: 0,
                    maximum: 60000,
                    description: Latest client media time to first byte in milliseconds; null when unavailable,
                  }
                paused: { type: boolean }
      responses:
        '204': { description: Activity accepted }
        '400': { description: Invalid report or unknown profile }
        '401': { description: Authentication or playback session ownership invalid }
        '404': { description: Channel not found }
        '410': { description: Stream stopped }
        '503': { description: Activity capacity reached }
    delete:
      x-alreadyon-roles: [owner, viewer]
      operationId: endPlaybackActivity
      tags: [status]
      summary: Remove this principal's player from active activity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [viewerId]
              properties:
                viewerId: { type: string }
      responses:
        '204': { description: Activity removed }
        '401': { description: Authentication required }
  /api/settings/ddns:
    get:
      x-alreadyon-roles: [owner]
      summary: Read DDNS provider setup and update status without credentials
      operationId: getDdnsStatus
      tags: [Settings]
      responses:
        '200':
          description: Active provider and all provider-specific public status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DdnsStatus'
        '401':
          description: Sign-in required
    put:
      x-alreadyon-roles: [owner]
      summary: Save provider-local DDNS credentials and select the active provider
      operationId: saveDdns
      tags: [Settings]
      description: |
        Saving a configured provider enables automatic updates and performs an
        initial sync; choosing none disables the worker. Cloudflare automatically
        discovers its zone and creates/updates one DNS-only A record, skipping
        writes for an already-correct record. Latest attempt and sanitized failure
        details are returned even if the provider sync fails. Credentials are
        write-only. Omit secret to retain it; clearSecret removes it and disables
        automatic updates. Historical custom selections migrate to none.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DdnsUpdate'
      responses:
        '200':
          description: Saved non-secret status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DdnsStatus'
        '400':
          description: Invalid hostname or missing required setup
        '401':
          description: Sign-in required
        '409':
          description: An update is already running
  /api/settings/ddns/test:
    post:
      x-alreadyon-roles: [owner]
      summary: Update a saved DDNS provider and verify its public IPv4 DNS record
      operationId: testDdns
      tags: [Settings]
      description: |
        This explicitly changes the provider's DNS record even when automatic
        updates are disabled. Requires saved credentials and respects persisted
        cooldowns/blocks. Provider acceptance and public verification timestamps
        are separate; sanitized provider failures appear in lastError on a 200
        status response. It does not configure a router or issue a certificate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider]
              properties:
                provider:
                  type: string
                  enum: [cloudflare, no-ip]
      responses:
        '200':
          description: Latest non-secret provider status, including failures or cooldown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DdnsStatus'
        '400':
          description: Save a valid provider configuration before testing
        '401':
          description: Sign-in required
        '409':
          description: An update is already running

components:
  securitySchemes:
    BrowserSession:
      type: apiKey
      in: cookie
      name: alreadyon_session
      description: >
        Set by POST /api/auth/setup or /api/auth/login (HttpOnly, SameSite=Lax,
        30 days). The cookie name is alreadyon_<random>, generated once per
        database. Writes must be same-origin. The session carries the account's
        role (see x-alreadyon-roles on each operation). The Swagger UI uses it
        automatically once you are signed in.
    ManagementKey:
      type: http
      scheme: bearer
      description: API key for scripts and tools, provisioned locally; never put it in a URL.
    PlaybackToken:
      type: apiKey
      in: query
      name: token
      description: Five-minute scoped playback token; every media request validates it and its issuing key.
  parameters:
    ProfileUserId:
      name: userId
      in: query
      required: false
      description: Owner only. Act on this account's profiles instead of the caller's.
      schema:
        type: integer
        format: int64
        minimum: 1
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    MediaChannel:
      name: channel
      in: path
      required: true
      schema:
        type: integer
        minimum: 0
    ChannelId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ProfileId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  schemas:
    TlsStatus:
      type: object
      required: [mode, names, fingerprint, issuedAt, expiresAt, trustExpiresAt]
      properties:
        mode: { type: string, enum: [self-signed, user-provided, acme] }
        names: { type: array, items: { type: string } }
        fingerprint: { type: string, description: SHA-256 hexadecimal digest of the public instance CA DER, pattern: '^[0-9a-f]{64}$' }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        trustExpiresAt: { type: string, format: date-time }
        acme:
          type: object
          description: No private key or challenge tokens are returned. Unix timestamps are seconds; zero means never.
          properties:
            hostname: { type: string }
            email: { type: string }
            enabled: { type: boolean }
            running: { type: boolean }
            lastAttempt: { type: integer, format: int64 }
            lastSuccess: { type: integer, format: int64 }
            nextAttempt: { type: integer, format: int64 }
            message: { type: string }
            stagingHostname: { type: string }
            agreementAccepted: { type: boolean }
            configured: { type: boolean }

    ActiveViewer:
      type: object
      required: [id, channel, video, profile, sourceIp, device, mode, encoder, bandwidthMbps, latencyMs, commercial, paused, updatedAt]
      properties:
        id: { type: string, description: Random player identifier; not a playback credential }
        channel: { type: string }
        video: { type: string, description: File basename; UI clips to 50 Unicode code points }
        profile: { type: string }
        sourceIp: { type: string }
        device: { type: string, description: Device category and browser/OS inferred from User-Agent; not a hostname }
        mode: { type: string, enum: [direct, remux, transcode] }
        encoder: { type: string, description: Actual encoder including runtime fallback; empty when no conversion is needed }
        videoReason: { type: string, description: Main-program video delivery or conversion reason; retained during commercials }
        audioReason: { type: string, description: 'Main-program audio delivery or conversion reason, or no audio track; retained during commercials' }
        bandwidthMbps:
          { type: [number, 'null'], description: Successfully written media bytes divided by report interval, in megabits per second; null until sampled }
        latencyMs: { type: [number, 'null'], description: Client media time to first byte; null when unavailable }
        commercial: { type: boolean, description: Retained program readings are frozen during a commercial }
        paused: { type: boolean }
        updatedAt: { type: string, format: date-time, description: Last program measurement time; frozen through commercials }
    ActiveProcess:
      type: object
      required: [id, name, startedAt, runtimeSeconds, completed, total, percent, unit]
      properties:
        id: { type: string }
        name: { type: string }
        startedAt: { type: string, format: date-time }
        runtimeSeconds: { type: number }
        completed: { type: integer }
        total: { type: integer }
        percent: { type: [number, 'null'], minimum: 0, maximum: 100, description: Counted completion; null when total is not known }
        unit: { type: string, description: Basis of completion, such as media candidates, channels, items, sample windows, or seconds of audio }
        currentFile: { type: string, description: Optional original basename of the file being analyzed; never a filesystem path }
    PlaybackCapabilities:
      type: object
      additionalProperties: false
      description: Client startup results cached for 24 hours. Reports are hints, never authorization.
      properties:
        hls:
          type: boolean
        containers:
          type: array
          items:
            type: string
        mbps:
          type: number
          minimum: 0
          maximum: 100000
          description: Measured download Mbps; zero assumes 25. Server uses at most 80 percent, capped at a 90 Mbps planning budget. This is not a socket traffic shaper.
        video:
          type: array
          maxItems: 64
          items:
            type: object
            properties:
              codec: { type: string }
              profile: { type: string }
              level: { type: integer }
              width: { type: integer }
              height: { type: integer }
              fps: { type: number }
              bitrate: { type: integer }
              pixelFormat: { type: string }
              container: { type: string, description: Container tested for file playback. }
              codecTag: { type: string }
              colorTransfer: { type: string }
              hdrMetadata: { type: string }
              dolbyVisionProfile: { type: integer }
              dolbyVisionLevel: { type: integer }
        audio:
          type: array
          maxItems: 32
          items:
            type: object
            properties:
              codec: { type: string }
              container: { type: string }
              profile: { type: string }
              spatial: { type: boolean, description: Spatial rendering explicitly reported by the browser. }
              hls: { type: boolean, description: Audio configuration also tested for media-source playback. }
              channels: { type: integer }
              sampleRate: { type: integer }
              bitrate: { type: integer }
    TunedPlayback:
      allOf:
        - $ref: '#/components/schemas/PlaybackSession'
        - type: object
          properties:
            url: { type: string }
            ready: { type: boolean }
            serverTime: { type: string, format: date-time }
            channelNumber: { type: integer, description: Number of the playing channel. }
            channelName: { type: string, description: Name of the playing channel. }
            program:
              description: Metadata for this stream's actual schedule entry, rather than the wall-clock guide. Omitted if unavailable.
              $ref: '#/components/schemas/GuideProgram'
            entryStartsAt: { type: string, format: date-time }
            entryEndsAt: { type: string, format: date-time }
            uhd: { type: boolean, description: True while a hardware encoder is in use, so the Quality menu may offer 2160 (4K). }
            sourceOffsetSeconds: { type: number }
            streamOffsetSeconds: { type: number }
            hlsOrigin:
              type: string
              format: date-time
              description: First muxer program-date-time, used to map sliding HLS windows onto schedule time. Present when HLS is ready.
            mediaFileId: { type: integer }
            kind: { type: string, enum: [program, commercial] }
            durationSeconds:
              type: number
              description: Length of the whole source file, for a total-time display that does not depend on how much has been converted.
            sourceHeight:
              type: integer
            details:
              type: object
              description: >
                How the file became this stream, for Show Playback Details: file
                name and container; source and output video and audio (codec,
                profile, size, rate, bitrate, dynamic range, and whether each is
                Direct, Copied or Converted); why each was or was not converted;
                and where decoding, scaling, tone mapping and encoding run
                (`pipeline`). It follows a fallback to a simpler pipeline.
            runtime:
              type: object
              description: Process-scoped live FFmpeg diagnostics. Values are absent for direct play and until a remux or transcode worker reports them.
              properties:
                cpuUtil:
                  type: number
                  minimum: 0
                  description: CPU time consumed by this FFmpeg process during the latest sampling interval, as a percentage of one logical CPU.
            audioTracks:
              type: array
              items:
                type: object
                required: [index, codec, channels]
                properties:
                  index: { type: integer }
                  codec: { type: string }
                  channels: { type: integer }
                  language: { type: string }
                  title: { type: string }
                  default: { type: boolean }
            subtitles:
              type: array
              description: Text subtitle tracks fetchable from GET /media/{channel}/subtitles/{index}. Bitmap formats are not listed.
              items:
                type: object
                required: [index, codec]
                properties:
                  index: { type: integer, description: Stream index in the source file }
                  language: { type: string }
                  title: { type: string }
                  codec: { type: string }
                  default: { type: boolean }
                  forced: { type: boolean }
            presentationDelaySeconds:
              type: number
              description: Clients present serverTime minus this delay. The entry and streamOffsetSeconds are selected for that presented moment, not the server clock.
            plan:
              type: object
              properties:
                mode: { type: string, enum: [direct, remux, transcode] }
                videoCopy: { type: boolean }
                audioCopy: { type: boolean }
                width: { type: integer }
                height: { type: integer }
                fps: { type: number }
                videoBitrate: { type: integer }
                audioBitrate: { type: integer }
                audioTrackIndex: { type: integer, description: Selected source audio index; -1 when absent. }
                volumeOffsetDb: { type: number, description: Commercial-only gain applied after normalization. }
                audioChannels: { type: integer, enum: [2, 6, 8] }
                profile: { type: string }
                reason: { type: string }
                lowWidth: { type: integer, description: Present only on a ladder stream, with lowHeight and lowBitrate. }
                lowHeight: { type: integer, description: Height of the small rendition; the stream's master playlist lists it beside the main one. }
                lowBitrate: { type: integer }
                encoder:
                  {
                    type: string,
                    description: The hardware encoder that produced the video (intel-qsv,
                    intel-vaapi,
                    nvidia-nvenc or amd-vaapi); absent for software.,
                  }
                decoder:
                  {
                    type: string,
                    enum: [hardware],
                    description: Present when the GPU decodes and scales the video (Hardware Decoding; needs encoder). Absent means the CPU.,
                  }
                toneMapper:
                  {
                    type: string,
                    enum: [gpu, cpu],
                    description: For an HDR source that is tone mapped,
                    where that runs. GPU tone mapping is Intel (VAAPI,
                    Quick Sync) and HDR10 only.,
                  }
    PlaybackSession:
      type: object
      required: [id, channelId, expiresAt, token, mediaUrl]
      properties:
        id:
          type: string
        channelId:
          type: integer
        expiresAt:
          type: string
          format: date-time
        token:
          type: string
        mediaUrl:
          type: string
          description: Media listener base for this channel. Append the resource and scoped token.
    PlaybackDelivery:
      type: object
      additionalProperties: false
      properties:
        mediaUrl:
          type: string
          deprecated: true
          description: Deprecated; retained for compatibility but ignored. Media URLs use the same HTTPS origin as UI/API requests.
        allowedOrigins:
          type: array
          maxItems: 16
          items:
            type: string
          description: Additional exact allowed browser origins. The application request origin is always allowed; forwarded headers do not grant origin trust.
    PlaybackSettings:
      type: object
      additionalProperties: false
      required: [maxProcesses, maxRenditions, maxViewers, leaseSeconds]
      properties:
        maxProcesses:
          type: integer
          description: The administrator's own limit on parallel conversions, used only while autoProcesses is false.
          minimum: 1
          maximum: 16
          default: 2
        autoProcesses:
          type: boolean
          description: Use the limit the server detects from its own speed, CPU count and free memory (see getServerCapacity).
          default: true
        maxRenditions:
          type: integer
          minimum: 1
          maximum: 32
          default: 8
        maxViewers:
          type: integer
          minimum: 1
          maximum: 1024
          default: 256
        leaseSeconds:
          type: integer
          description: Viewer lease without an authenticated renewal. Must exceed the browser's ten-second heartbeat; migration 0033 raises stored values below 20.
          minimum: 20
          maximum: 120
          default: 30
        ladder:
          type: boolean
          default: false
          description: Add a 360p rendition to conversions of 720p or larger so a stream can start on it and move up. Off by default because it costs about 75% more CPU per stream (docs/PLAYBACK.md). Omitting it on PUT turns it off.

    StartupStatus:
      type: object
      required: [phase, active, startupComplete, mediaRoots, library]
      properties:
        phase:
          type: string
          enum: [pending, scanning, classifying, populating, scheduling, ready, failed]
          description: >
            Current step of the active run, or the outcome of the most
            recent one (`ready`, or `failed` if it recorded an error).
            `pending` only before the startup run begins.
        active:
          type: boolean
          description: True while a run is in progress.
        trigger:
          type: string
          enum: [startup, refresh, poll]
          description: What started the current or most recent run.
        startupComplete:
          type: boolean
          description: True once the first startup run has ended (cleanly or not).
        mediaRoots:
          type: integer
          description: Number of usable media folders configured. 0 means nothing will ever be scanned.
        startedAt:
          type: [string, 'null']
          format: date-time
        finishedAt:
          type: [string, 'null']
          format: date-time
        lastError:
          type: string
          description: Latest error recorded by the current or most recent run; omitted when none.
        library:
          $ref: '#/components/schemas/LibraryCounts'

    LibraryCounts:
      type: object
      required: [filesFound, filesProbed, itemsIdentified, itemsClassified, channelsWithContent]
      properties:
        filesFound:
          type: integer
          description: Media files recorded by the scanner.
        filesProbed:
          type: integer
          description: Of those, files with a known duration.
        itemsIdentified:
          type: integer
          description: Files matched to a movie or episode.
        itemsClassified:
          type: integer
          description: Identified items with genre data (possibly empty).
        channelsWithContent:
          type: integer
          description: Channels with at least one lineup item.

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok

    Error:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
          description: >
            Machine-readable reason when a client should act on it, for example
            `forbidden`, `password_change_required`, `password_locked`,
            `stream_limit`, `stream_capacity`, `username_taken`, `last_owner`
            or `too_many_users`.

    LogEntry:
      type: object
      properties:
        time:
          type: string
          format: date-time
        level:
          type: string
          enum: [debug, info, warn, error, critical]
        message:
          type: string

    LogsResponse:
      type: object
      properties:
        timeZone:
          type: string
          description: The server's IANA time zone (the TZ environment variable, default America/New_York). Entry times carry that zone's offset, daylight saving included.
          example: America/New_York
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LogEntry'

    Channel:
      type: object
      properties:
        id:
          type: integer
          format: int64
        number:
          type: integer
        name:
          type: string
        visibility:
          type: string
          enum: [auto, show, hide]
          description: The administrator's choice; new channels are auto.
        hidden:
          type: boolean
          description: The effective result of `visibility` (auto hides an empty channel). Excluded from GET /api/guide when true. Channel management endpoints always return every channel regardless.
        itemCount:
          type: integer
          description: How many distinct shows/movies (not episodes) are currently in this channel's lineup.
        filter:
          oneOf:
            - $ref: '#/components/schemas/ChannelFilter'
            - type: 'null'
          description: The rule the lineup is built from, or null for a hand-managed channel. Built-in channels get one at startup.

    ChannelFilter:
      type: object
      required: [audienceTier]
      properties:
        excludedGenres:
          type: array
          items: { type: string }
          description: Genre IDs that exclude a title even if an included genre matches.
        requireKnownYear:
          type: boolean
          default: false
          description: Exclude titles without a known series premiere or movie release year.
        ageRestrictionId:
          type: string
          description: Shared age definition ID; absent uses audienceTier.
        eras:
          type: array
          items: { type: string }
          description: OR across shared era IDs; empty uses legacy era.
        titlePhrases:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 100 }
          description: Case-insensitive OR phrases; empty uses legacy titleContains.
        includedPaths:
          type: array
          items: { type: string }
          description: Explicit included directories and descendants. Omitted or null includes all paths; an empty array includes none.
        excludedPaths:
          type: array
          items: { type: string }
          description: Absolute excluded directories and descendants.

        audienceTier:
          type: string
          enum: [young_child, teen, adult]
          description: >
            The audience the channel is for. A hard boundary: content this
            tier may not watch, or with an unknown rating, never matches.
        genres:
          type: array
          items:
            type: string
          description: Genre ids from GET /api/library/genres; content matches if it has any of them. Empty means any genre.
        mediaType:
          type: string
          enum: [tv, movie, both]
          default: both
        era:
          type: string
          enum: [modern, nostalgia, both]
          default: both
          description: modern is 2010 onward, nostalgia is 2009 and earlier. Content with no known year matches either.
        titleContains:
          type: string
          maxLength: 100
          description: Case-insensitive match anywhere in a movie's title or a show's name. Empty means no title filter.

    ChannelDraft:
      type: object
      required: [number, name]
      properties:
        number:
          type: integer
        name:
          type: string
        filter:
          oneOf:
            - $ref: '#/components/schemas/ChannelFilter'
            - type: 'null'

    GuideProgram:
      type: object
      properties:
        mediaFileId:
          type: integer
          format: int64
        kind:
          type: string
          enum: [program, commercial]
        title:
          type: string
        seriesTitle:
          type: string
          description: Present only for a TV episode; the show's own title (see episode-vs-series field split).
        seasonNumber:
          type: integer
        episodeNumber:
          type: integer
        mediaType:
          type: string
          description: e.g. "movie" or "episode"
        overview:
          type: string
          description: The movie's own synopsis, or the episode's own description (never the parent show's overview).
        year:
          type: integer
          description: A movie's release year; omitted when unknown.
        contentRating:
          type: string
          description: The movie's or show's certification, e.g. PG or TV-14; omitted when unknown.
        airDate:
          type: string
          description: An episode's original air date, or a movie's release date, as YYYY-MM-DD; omitted when unknown.
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        sourceOffsetSeconds:
          type: number
          description: >
            Where within the file playback should start. Non-zero only
            for a program a mid-program commercial break (see
            CommercialSettings mode "interval") split into multiple
            segments.
      required: [mediaFileId, kind, title, startsAt, endsAt]

    AuthStatus:
      type: object
      required: [setupRequired, authenticated]
      properties:
        setupRequired:
          type: boolean
          description: True until the first (owner) account has been created.
        authenticated:
          type: boolean
        username:
          type: string
        role:
          type: string
          enum: [owner, viewer]
          description: The signed-in account's role; absent when signed out.
        mustChangePassword:
          type: boolean
          description: >
            The account must change its password with POST /api/auth/password
            before any other operation is allowed.
        passwordLocked:
          type: boolean
          description: The account cannot change its own password; only an owner can.
    SessionLifetime:
      type: object
      additionalProperties: false
      required: [days]
      properties:
        days:
          type: integer
          minimum: 0
          maximum: 3650
          description: 0 disables absolute browser expiry; enabled inactivity cleanup still applies.
    BrowserSession:
      type: object
      required: [id, userAgent, createdAt, lastActiveAt, expiresAt, current]
      properties:
        id:
          type: integer
          format: int64
        deviceName:
          type: string
          description: OS/native device label (Windows, Linux, Mac, Google TV, Android Phone); unknown systems use Unknown Device. Not a computer hostname.
        deviceType:
          type: string
          description: Retained compatibility category; Settings omits its Type column.
        ipAddress:
          type: string
          description: Server-observed socket peer IP; forwarding headers are ignored.
        userAgent:
          type: string
        createdAt:
          type: string
          format: date-time
        lastActiveAt:
          type: [string, 'null']
          format: date-time
          description: Last authenticated browser or media activity, recorded at most once every 30 seconds. Null for older sessions with no activity recorded since upgrading.
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: Null when there is no absolute expiry; enabled inactivity cleanup still applies.
        current:
          type: boolean
    User:
      type: object
      required: [id, username, role, disabled, mustChangePassword, passwordLocked, maxStreams, createdAtUnix, updatedAtUnix]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        role:
          type: string
          enum: [owner, viewer]
        disabled:
          type: boolean
          description: A disabled account cannot sign in.
        mustChangePassword:
          type: boolean
        passwordLocked:
          type: boolean
          description: Only an owner can change this account's password.
        maxStreams:
          type: integer
          minimum: 0
          maximum: 32
          description: Devices that may watch at once; 0 means only the server-wide limits apply.
        createdAtUnix:
          type: integer
          format: int64
        updatedAtUnix:
          type: integer
          format: int64
    UserCreate:
      type: object
      additionalProperties: false
      required: [username, password, role]
      properties:
        username:
          type: string
          maxLength: 64
        password:
          type: string
          minLength: 4
          maxLength: 256
        role:
          type: string
          enum: [owner, viewer]
        mustChangePassword:
          type: boolean
          default: false
        passwordLocked:
          type: boolean
          default: false
        maxStreams:
          type: integer
          minimum: 0
          maximum: 32
    UserPatch:
      type: object
      additionalProperties: false
      properties:
        username:
          type: string
          maxLength: 64
        role:
          type: string
          enum: [owner, viewer]
        disabled:
          type: boolean
        mustChangePassword:
          type: boolean
        passwordLocked:
          type: boolean
        maxStreams:
          type: integer
          minimum: 0
          maximum: 32
    Credentials:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 64
        password:
          type: string
          minLength: 4
          maxLength: 256

    GuideChannel:
      type: object
      properties:
        channelId:
          type: integer
          format: int64
        number:
          type: integer
        name:
          type: string
        audienceTier:
          type: string
          enum: [young_child, teen, adult]
          description: The audience the channel's filter is set for. Omitted for a channel without a filter.
        programs:
          type: array
          items:
            $ref: '#/components/schemas/GuideProgram'
        previousPrograms:
          type: array
          description: Real ended airings overlapping the last 30 minutes, for non-interactive clipped guide history. Original timestamps are preserved; current/upcoming programs remain in programs.
          items:
            $ref: '#/components/schemas/GuideProgram'

    InactiveSessionPolicy:
      type: object
      required: [enabled, days]
      properties:
        enabled:
          type: boolean
          default: true
        days:
          type: integer
          minimum: 1
          maximum: 3650
          default: 14

    PreviewResponse:
      type: object
      properties:
        program:
          $ref: '#/components/schemas/GuideProgram'
        offsetSeconds:
          type: number
          description: How far into the program playback currently is.

    ChannelCommercialSettings:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: [boolean, 'null']
          description: Null inherits global enablement; true or false overrides it.
        folders:
          type: [array, 'null']
          maxItems: 50
          items: { type: string }
          description: Exact configured commercial folder paths. Empty or null means all; duplicates are normalized.
    ChannelCommercialPolicy:
      type: object
      required: [enabled, folders, globalEnabled, effectiveEnabled, availableFolders, effectiveFolders, foldersFallback]
      properties:
        enabled: { type: [boolean, 'null'] }
        folders: { type: array, items: { type: string } }
        globalEnabled: { type: boolean }
        effectiveEnabled: { type: boolean }
        availableFolders: { type: array, items: { type: string } }
        effectiveFolders: { type: array, items: { type: string } }
        foldersFallback:
          type: boolean
          description: At least one saved folder was removed; all current folders are effective until a new selection is saved.
    CommercialSettings:
      type: object
      properties:
        volumeOffsetDb:
          type: number
          default: 0
          minimum: -30
          maximum: 12
          description: Server-side gain applied only to commercials, after normalization when available. Nonzero gain requires audio conversion. Positive gain uses a peak limiter.
        enabled:
          type: boolean
        mode:
          type: string
          enum: [between-only, interval]
          description: >
            "between-only" (default) inserts a break only between one
            whole program and the next. "interval" additionally inserts
            breaks partway through a single program, roughly every
            intervalMinutes, never within the first/last few minutes of
            it (5 for a TV episode, 15 for a movie).
        intervalMinutes:
          type: integer
          enum: [15, 30, 60]
          description: Only meaningful when mode is "interval".
        tvCommercialsPerBreak:
          type: integer
          minimum: 1
          maximum: 5
          description: Maximum unique commercials per break after/during a TV episode. Default 2. A smaller pool produces a shorter break.
        movieCommercialsPerBreak:
          type: integer
          minimum: 1
          maximum: 5
          description: Maximum unique commercials per break after/during a movie. Default 5. A smaller pool produces a shorter break.

    FolderSettings:
      type: object
      required: [tv, movies, commercials, exclusions]
      properties:
        tv:
          $ref: '#/components/schemas/FolderList'
        movies:
          $ref: '#/components/schemas/FolderList'
        commercials:
          $ref: '#/components/schemas/FolderList'
        exclusions:
          type: object
          required: [patterns, default, source]
          properties:
            patterns:
              type: array
              items:
                type: string
            default:
              type: array
              items:
                type: string
            source:
              type: string
              enum: [default, admin]

    FolderList:
      type: object
      required: [paths, default, source]
      properties:
        paths:
          type: array
          items:
            type: object
            required: [path, status]
            properties:
              path:
                type: string
              status:
                type: string
                enum: [ok, notAbsolute, notFound, notDirectory, unreadable]
              count:
                type: integer
                description: Identified healthy movie and episode files under this media directory, including descendants.
        default:
          type: array
          items:
            type: string
        source:
          type: string
          enum: [default, admin]

    FolderSettingsUpdate:
      type: object
      description: Each field is optional; `null` resets that list to its default.
      properties:
        tv:
          type: [array, 'null']
          items:
            type: string
        movies:
          type: [array, 'null']
          items:
            type: string
        commercials:
          type: [array, 'null']
          items:
            type: string
        exclusions:
          type: [array, 'null']
          items:
            type: string

    MediaSettings:
      type: object
      properties:
        pollIntervalMinutes:
          type: integer
          enum: [15, 30, 60, 120, 240, 480, 720, 1440]
          description: How often the background scanner re-checks configured media roots for new content. Default 60.

    MetadataSettingsStatus:
      type: object
      properties:
        tmdbApiKeySet:
          type: boolean
          description: Whether a TMDb API key is saved. The key itself is never returned.
        keylessMetadata:
          type: boolean
          description: >
            Opt-in (default false). While no TMDb key is set, classify titles with
            TVmaze (TV) and Wikidata (movies), which need no account. Titles are sent
            to those services. Always false while a TMDb key is set.

    MetadataSettingsUpdate:
      type: object
      properties:
        tmdbApiKey:
          type: string
          description: Omit to leave untouched; "" to clear; a non-empty value to set (validated for shape).
        keylessMetadata:
          type: boolean
          description: Omit to leave untouched. Turning it on while a TMDb key is set is rejected with 409.

    RefreshScheduleResult:
      type: object
      properties:
        classified:
          type: boolean
          description: Whether TMDb genre classification ran (a key was configured).
        enriched:
          type: boolean
          description: Whether TMDb overview/date/certification enrichment ran (a key was configured).
        channelsRefreshed:
          type: integer
          description: How many built-in default channel lineups were rebuilt from scratch.
        schedulesRegenerated:
          type: integer
          description: >
            How many channels' persisted schedule (roughly 1 hour in the
            past through 48 hours ahead) were brought up to date. Never
            disturbs an entry already airing — see schedule.Regenerate.

    ServerSettings:
      type: object
      properties:
        serverName:
          type: string
          minLength: 1
          maxLength: 64
          description: Friendly name returned to native LAN discovery clients; defaults to AlreadyOn. Surrounding whitespace is trimmed; control characters are rejected.
        transcoding:
          type: string
          enum: [software, intel, nvidia-nvenc, amd-vaapi]
          description: >
            Default software. `intel` uses Quick Sync when its test (and, with
            hardwareDecoding, the whole-GPU test) passes and VA-API otherwise;
            plans report the encoder actually used (`intel-qsv` or `intel-vaapi`).
            Migration 0060 folded the former `intel-qsv` and `intel-vaapi` values into `intel`.
        tlsMode:
          type: string
          enum: [self-signed, user-provided, acme]
          description: Default self-signed.
        acmeProvider:
          type: string
          enum: [letsencrypt]
          description: Default letsencrypt.
        acmeDomain:
          type: string
          description: Empty, or a host name.
        ddnsProvider:
          type: string
          enum: [none, cloudflare, no-ip]
          description: Default none.
        hardwareDecoding:
          type: boolean
          description: Move decoding, scaling and tone mapping to the GPU too. Default false. Needs a hardware `transcoding` choice (400 otherwise); choosing software turns it off. Used for streams whose source the GPU can decode; a failed GPU step retries on the CPU.

    DdnsUpdate:
      type: object
      additionalProperties: false
      required: [provider]
      properties:
        provider:
          type: string
          enum: [none, cloudflare, no-ip]
        hostname:
          type: string
          description: One full public DNS hostname, no URL, wildcard or port. Required unless none.
        zoneId:
          type: string
          description: Legacy input ignored. Cloudflare zone ID is discovered automatically.
          deprecated: true
        username:
          type: string
          description: No-IP update username; not required for token providers.
        secret:
          type: string
          writeOnly: true
          description: Provider-local token/password; omitted retains the saved credential.
        clearSecret:
          type: boolean
          description: Clear the selected provider credential and disable automatic updates.
        enabled:
          type: boolean
          description: Legacy input ignored. Saving a configured provider always enables automatic sync.
          deprecated: true
    DdnsConfig:
      type: object
      properties:
        provider:
          type: string
        hostname:
          type: string
        zoneId:
          type: string
        username:
          type: string
        hasSecret:
          type: boolean
        enabled:
          type: boolean
        lastAttempt:
          type: integer
          format: int64
          description: UTC Unix seconds, or zero before first attempt.
        lastUpdate:
          type: integer
          format: int64
          description: Latest provider-accepted update, not proof of internet reachability.
        lastVerified:
          type: integer
          format: int64
          description: Latest matching public A-record verification in UTC Unix seconds.
        lastIp:
          type: string
          description: Last provider-accepted public IPv4 address.
        lastError:
          type: string
          description: Sanitized failure message; never contains credentials/provider response bodies.
        nextAttempt:
          type: integer
          format: int64
          description: Earliest next update/test, including failure backoff.
        blocked:
          type: boolean
          description: Permanent provider refusal stops attempts until setup is corrected and saved.
    DdnsStatus:
      type: object
      properties:
        provider:
          type: string
          enum: [none, cloudflare, no-ip]
        running:
          type: string
          description: Provider currently updating, or empty.
        configs:
          type: array
          items:
            $ref: '#/components/schemas/DdnsConfig'

    Profile:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 40
        role:
          type: string
          enum: [admin, viewer]
        audienceTier:
          type: string
          enum: [young_child, teen, adult]
        hasPin:
          type: boolean
          description: Whether a PIN is set. The PIN and its hash are never returned.
        icon:
          type: [string, 'null']
          description: >
            A preset id (fox, cat, dog, lion, panda, koala, owl, frog,
            monkey, rabbit), or the URL of an uploaded image, or null.
        fontLevel:
          deprecated: true
          type: [integer, 'null']
          minimum: 0
          maximum: 3
        brightnessLevel:
          deprecated: true
          type: [integer, 'null']
          minimum: 0
          maximum: 3
        guideTimeFormat:
          type: [string, 'null']
          enum: ['12h-padded', '12h', '24h', null]
        subtitleMode:
          type: [string, 'null']
          enum: ['always', 'other_audio', 'off', null]
          description: Always on, enabled when playing audio differs from audioLanguage, or off. Uses subtitleLanguage; unknown audio or missing matching subtitles does not interrupt playback. Null retains subtitlesEnabled. Setting a mode updates subtitlesEnabled for older clients; legacy subtitlesEnabled patches clear the mode.
        subtitlesEnabled:
          type: [boolean, 'null']
          description: Show subtitles by default. Null means off.
        audioLanguage:
          type: [string, 'null']
          pattern: '^[a-z]{2}$'
          description: Preferred audio language. Null uses English. Explicit player selection does not change this preference.
        subtitleLanguage:
          type: [string, 'null']
          pattern: '^[a-z]{2}$'
          description: Default subtitle language as an ISO 639-1 code. Null means en.
        lastWatchedChannelId:
          type: [integer, 'null']
          format: int64
          readOnly: true
          description: Last successfully tuned channel identity, shared across devices and sessions. Null until a tune supplies profileId, or after channel deletion. Clients restore only if present with playable content in the profile's filtered guide; otherwise use their normal default selection.

    ProfileDraft:
      type: object
      required: [name, role, audienceTier]
      properties:
        name:
          type: string
          maxLength: 40
        role:
          type: string
          enum: [admin, viewer]
        audienceTier:
          type: string
          enum: [young_child, teen, adult]

    ProfilePatch:
      type: object
      description: Any subset of the editable Profile fields (all but `id` and `hasPin`).
      properties:
        name:
          type: string
          maxLength: 40
        role:
          type: string
          enum: [admin, viewer]
        audienceTier:
          type: string
          enum: [young_child, teen, adult]
        icon:
          type: [string, 'null']
          description: A preset id, or null to remove the icon.
        fontLevel:
          deprecated: true
          type: [integer, 'null']
          minimum: 0
          maximum: 3
        brightnessLevel:
          deprecated: true
          type: [integer, 'null']
          minimum: 0
          maximum: 3
        guideTimeFormat:
          type: [string, 'null']
          enum: ['12h-padded', '12h', '24h', null]
        subtitleMode:
          type: [string, 'null']
          enum: ['always', 'other_audio', 'off', null]
          description: Always on, enabled when playing audio differs from audioLanguage, or off. Uses subtitleLanguage; unknown audio or missing matching subtitles does not interrupt playback. Null retains subtitlesEnabled. Setting a mode updates subtitlesEnabled for older clients; legacy subtitlesEnabled patches clear the mode.
        subtitlesEnabled:
          type: [boolean, 'null']
          description: Show subtitles by default. Null means off.
        audioLanguage:
          type: [string, 'null']
          pattern: '^[a-z]{2}$'
          description: Preferred audio language. Null uses English. Explicit player selection does not change this preference.
        subtitleLanguage:
          type: [string, 'null']
          pattern: '^[a-z]{2}$'
          description: Default subtitle language as an ISO 639-1 code. Null means en.
    UpdatedCount:
      type: object
      properties:
        updated:
          type: integer

    UnmatchedItem:
      type: object
      properties:
        tmdbId:
          type: integer
          description: Known movie or parent show TMDb ID, or zero.
        id:
          type: integer
          format: int64
          description: Identifies the item in `PATCH /api/library/items`.
        path:
          type: string
        mediaType:
          type: string
          enum: [movie, episode]
        title:
          type: string
        seriesTitle:
          type: [string, 'null']
        season:
          type: [integer, 'null']
        episode:
          type: [integer, 'null']
        year:
          type: [integer, 'null']
        genres:
          type: [array, 'null']
          items:
            type: string
          description: Null until the item has been classified; an empty list means classification found no genres.
        certification:
          type: [string, 'null']
        isManual:
          type: boolean
          description: True once an admin has corrected the item's identification; rescans no longer overwrite it.
        reason:
          type: string
          description: Why no channel has picked it up.

    LibraryItemPatch:
      type: object
      description: >
        Correcting what an item is (`mediaType`, `title`, `seriesTitle`,
        `year`, `season`, `episode`) protects it from rescans and queues
        automatic genre and metadata lookups again on the next refresh.
        Genres and a certification set here are kept over automatic values.
      properties:
        mediaType:
          type: string
          enum: [movie, episode]
          description: Switching to movie clears series, season and episode. An episode must have a `seriesTitle`.
        title:
          type: string
          maxLength: 200
        seriesTitle:
          type: [string, 'null']
          maxLength: 200
        year:
          type: [integer, 'null']
          minimum: 1870
          maximum: 2100
        season:
          type: [integer, 'null']
          minimum: 0
        episode:
          type: [integer, 'null']
          minimum: 0
        genres:
          type: [array, 'null']
          items:
            type: string
          description: Ids from `GET /api/library/genres`. An empty list means deliberately no genres; null returns to automatic.
        certification:
          type: [string, 'null']
          description: A rating from `GET /api/library/certifications` for the item's media type. For an episode it overrides its show's rating. Null or empty returns to automatic.

    ApiKey:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        keyPrefix:
          type: string
          description: The first several characters of the real key — enough to tell keys apart, never enough to reconstruct one.
        createdAt:
          type: string
          format: date-time

    ApiKeyCreated:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          properties:
            key:
              type: string
              description: The full raw key. Returned only here, once, at creation — copy it now.
