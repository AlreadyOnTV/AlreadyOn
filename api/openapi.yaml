  /api/library/unmatched:
    get:
      x-alreadyon-roles: [owner]
      operationId: listUnmatchedContent
      tags: [library]
      summary: Library files that aren't on any channel
      description: >
        Healthy, probed media files no channel airs, ordered by path, each
        with a short reason. A movie counts as matched when its file is in a
        lineup; an episode when any episode of its show is. The fallback
        demo channels (196-199) don't count. Files that haven't been probed
        are left out, since metadata wouldn't make them schedulable.
        Fix them with `PATCH /api/library/items`, then run Refresh Schedule.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: One page of unmatched items and the overall count
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/UnmatchedItem'
        '400':
          description: Invalid limit or offset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/library/items/{id}:
    patch:
      x-alreadyon-roles: [owner]
      operationId: updateLibraryItem
      tags: [library]
      summary: Correct one item's metadata
      description: >
        Only the fields present change. `null` clears `seriesTitle`, `year`,
        `season` and `episode`; for `genres` and `certification` it hands the
        item back to automatic classification. See `LibraryItemPatch`. No
        refresh runs: use Refresh Schedule to place the corrected item.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: The item's `id` from `GET /api/library/unmatched`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryItemPatch'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatedCount'
        '400':
          description: Unknown field or an invalid value (unknown genre, wrong rating vocabulary, an episode with no series, out-of-range year)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No item with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/library/items:
    patch:
      x-alreadyon-roles: [owner]
      operationId: updateLibraryItems
      tags: [library]
      summary: Apply the same correction to several items
      description: >
        The same field values are applied to every listed id, all or
        nothing: if any id is unknown or the values are invalid for any of
        them, nothing is written. At most 1000 ids.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/LibraryItemPatch'
                - type: object
                  required: [ids]
                  properties:
                    ids:
                      type: array
                      items:
                        type: integer
                        format: int64
                      maxItems: 1000
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatedCount'
        '400':
          description: No ids, too many ids, an unknown field, or an invalid value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: An id doesn't match any item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/channels/{id}/preview:
