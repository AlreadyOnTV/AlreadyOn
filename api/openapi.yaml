  /api/guide:
    get:
      x-alreadyon-roles: [owner, viewer]
      operationId: getGuide
      tags: [guide]
      summary: Every visible channel's programs (and inserted commercial breaks) from now through a requested window
      parameters:
        - name: hours
          in: query
          description: How many hours ahead to include. Defaults to 12 (the web UI's max "time span shown").
          schema:
            type: number
            default: 12
        - name: audienceTier
          in: query
          description: >
            Optional young_child/teen/adult tier (see the active profile,
            web/src/users/UsersContext.tsx). When given, drops any channel
            whose lineup contains content above that tier's allowed
            certifications entirely — a household content filter, not a
            security boundary (there's no real per-viewer auth yet).
            Omitted or unrecognized means unrestricted (adult).
          schema:
            type: string
            enum: [young_child, teen, adult]
      responses:
        '200':
          description: One entry per visible channel
          content:
