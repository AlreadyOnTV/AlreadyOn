      responses:
        '200':
          description: Updated channel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Channel'
        '400':
          description: Invalid input, reserved number range, or duplicate number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No channel with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
