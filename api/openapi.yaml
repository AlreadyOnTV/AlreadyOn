openapi: 3.1.0
info:
  title: AlreadyOn API
  version: 0.1.0-draft
  description: AlreadyOn server API.
security:
  - BrowserSession: []
  - ManagementKey: []
tags:
  - name: auth
  - name: health
  - name: status
  - name: logs
  - name: channels
  - name: guide
  - name: library
  - name: profiles
  - name: settings
  - name: admin
  - name: users
paths:
  /api/settings/tls:
    get:
      x-alreadyon-roles: [owner]
      tags: [settings]
      summary: Public metadata for the active instance TLS identity
      description: Requires management authentication. Never returns private keys. Active mode comes from the certificate manager, not legacy preferences. Includes non-secret ACME progress and configuration.
      responses:
        '200':
          description: Active certificate names, trust fingerprint and expiry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TlsStatus' }
        '401': { description: Authentication required }
    put:
      x-alreadyon-roles: [owner]
      tags: [settings]
      summary: Renew the shared server certificate for explicit DNS names and IP addresses
      description: Requires management authentication and cookie CSRF protection. Retains localhost and loopback SANs and the instance CA; existing TLS connections are not forcibly closed. Do not supply URLs, wildcards or ports.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [names]
              properties:
                names: { type: array, minItems: 1, maxItems: 32, items: { type: string, maxLength: 253 } }
      responses:
        '200':
          description: Updated active certificate metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TlsStatus' }
        '400': { description: Invalid names or renewal unavailable }
        '401': { description: Authentication required }
        '403': { description: Cross-site request refused }
  /api/settings/tls/acme:
    put:
      x-alreadyon-roles: [owner]
      tags: [settings]
      summary: Save agreement and start automatic staging and production issuance
      description: Uses the saved DDNS hostname when configured; otherwise requires hostname. Agreement revocation stops renewal without replacing the active certificate. Saving accepted terms starts asynchronous issuance, with staging first when needed. Authentication, CSRF protection, persisted cooldown and an eight-minute deadline apply. Poll TLS status every five minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, agree]
              properties:
                hostname: {type: string}
                email: {type: string, format: email}
                agree: {type: boolean}
      responses:
        '202': {description: Configuration saved; public TLS status returned}
        '400': {description: Invalid configuration or issuance cooldown/running}
    post:
      x-alreadyon-roles: [owner]
      tags: [settings]
      summary: Start staging validation or production Let's Encrypt HTTP-01 issuance
      description: Requires management authentication and cookie CSRF protection. Hostname is an explicit public DNS hostname or HTTPS URL, not an inferred request Host. Terms acceptance and email are mandatory. Production requires successful staging for the same hostname unless renewing the active identity. Requests are asynchronous, bounded to eight minutes, serialized and persisted with cooldown. Staging does not activate its untrusted certificate. HTTP-01 requires WAN TCP/80 routed to the isolated challenge listener on container TCP/19902; integrated DDNS is optional. Failure retains the active identity. Poll GET TLS status for progress.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [hostname, email, agree, staging]
              properties:
                hostname: { type: string, maxLength: 2048 }
                email: { type: string, format: email, maxLength: 254 }
                agree: { type: boolean }
                staging: { type: boolean }
      responses:
        '202':
          description: Validation started; poll TLS status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TlsStatus' }
        '400': { description: Invalid input, staging prerequisite, concurrent request or cooldown }
        '401': { description: Authentication required }
        '403': { description: Cross-site request refused }
  /api/settings/tls/ca.pem:
    get:
      x-alreadyon-roles: [owner]
      tags: [settings]
      summary: Download the public instance trust anchor
      description: Requires management authentication. Verify SHA-256 through a trusted server terminal before importing; never includes a private key.
      responses:
        '200':
          description: Public CA certificate download
          content:
            application/x-pem-file:
              schema: { type: string }
        '401': { description: Authentication required }
  /api/settings/tls/upload:
    post:
      x-alreadyon-roles: [owner]
      tags: [settings]
      summary: Upload and activate the shared HTTPS certificate
      description: Management authentication and cookie CSRF protection required. PEM server chain (leaf first), matching unencrypted key, and issuing CA bundle; combined PEM maximum 256 KiB and JSON maximum 300 KiB. Valid dates, chain, server-auth usage, SANs and minimum key strength are checked before activation. Requires at least one concrete DNS/IP SAN for verified health checks. Invalid input retains the active identity. Key is write-only. New connections use this identity; existing connections are not forcibly closed. Renew uploaded certificates manually.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [certificate, privateKey, ca]
              properties:
                certificate: { type: string, description: PEM server leaf followed by issuing intermediates }
                privateKey: { type: string, writeOnly: true, description: Matching unencrypted PEM key; never returned }
                ca: { type: string, description: Explicitly trusted issuing CA PEM bundle; public trust on client devices is a separate requirement }
      responses:
        '200':
          description: Active public certificate metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TlsStatus' }
        '400': { description: Invalid certificate or activation failed; previous identity retained }
        '401': { description: Authentication required }
        '403': { description: Cross-site request refused }
  /api/settings/tls/self-signed:
    post:
      x-alreadyon-roles: [owner]
      tags: [settings]
      summary: Restore the original instance self-signed identity
      description: Management authentication and cookie CSRF protection required. Preserves the original generated CA and names. New connections use the restored certificate; its original trust and hostname requirements apply. Does not erase the uploaded pair.
      responses:
        '200':
          description: Active public certificate metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TlsStatus' }
        '400': { description: Restore failed }
        '401': { description: Authentication required }
        '403': { description: Cross-site request refused }
  /api/tv/server:
    get:
      x-alreadyon-roles: [public]
      operationId: discoverTVServer
      tags: [auth]
      security: []
      summary: Read local server name and TV pairing availability
      description: Requires HTTPS and a direct private, loopback or link-local socket peer. Never lists accounts.
      responses:
        '200':
          description: Server name, pairingEnabled flag and protocol version
          content:
            application/json:
              schema:
                type: object
                required: [name, service, pairingEnabled, protocol]
                properties:
                  name: {type: string, minLength: 1, maxLength: 64}
                  service: {type: string, enum: [alreadyon]}
                  pairingEnabled: {type: boolean}
                  protocol: {type: integer, enum: [1]}
        '403':
          description: Not a local HTTPS request
  /api/tv/trust:
    get:
      x-alreadyon-roles: [public]
      operationId: getTVTrust
      tags: [auth]
      security: []
      summary: Read the public certificate trust anchor for local native sign-in
      description: Requires HTTPS and a direct LAN peer. Native apps accept the instance trust anchor automatically on first connection, then validate HTTPS against it before sending username and PIN. The fingerprint remains available for optional out-of-band verification.
      responses:
        '200':
          description: Public PEM certificate and fingerprint, never private keys
          content:
            application/json:
              schema:
                type: object
                required: [certificate, fingerprint]
                properties:
                  certificate: {type: string}
                  fingerprint: {type: string}
        '403':
          description: Not a local HTTPS request
  /api/auth/tv-login:
    post:
      x-alreadyon-roles: [public]
      operationId: loginTV
      tags: [auth]
      security: []
      summary: Sign in with username and account TV PIN on the LAN
      description: Requires HTTPS and a direct LAN peer. Subject to per-peer and aggregate failed-attempt limits and bounded credential concurrency. Disabled accounts or accounts requiring password changes cannot pair. Issues a persistent session until explicit sign-out or device revocation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, pin]
              additionalProperties: false
              properties:
                username: {type: string}
                pin: {type: string, pattern: '^[0-9]{6,12}$'}
      responses:
        '200':
          description: Signed in with the existing secure account session cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatus'
        '401':
          description: Username or PIN not accepted
        '403':
          description: Not a local HTTPS request
        '429':
          description: Pairing rate or concurrency limit reached
  /api/auth/tv-pin:
    get:
      x-alreadyon-roles: [owner, viewer]
      operationId: getOwnTVPIN
      tags: [auth]
      summary: Read whether the signed-in account has a TV PIN
      responses:
        '200':
          description: Enabled flag only; PIN and digest are never returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: {type: boolean}
    put:
      x-alreadyon-roles: [owner, viewer]
      operationId: setOwnTVPIN
      tags: [auth]
      summary: Set or replace the signed-in account's unique TV PIN
      description: Does not revoke existing sessions; use the existing session revocation endpoints to sign out paired TVs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              additionalProperties: false
              properties:
                pin: {type: string, pattern: '^[0-9]{6,12}$'}
      responses:
        '200':
          description: PIN saved
        '400':
          description: PIN must be 6–12 ASCII digits
        '409':
          description: Another account already uses that PIN
    delete:
      x-alreadyon-roles: [owner, viewer]
      operationId: clearOwnTVPIN
      tags: [auth]
      summary: Remove the signed-in account's TV PIN without revoking existing sessions
      responses:
        '204':
          description: PIN removed
  /api/auth/status:
    get:
      x-alreadyon-roles: [public]
      operationId: getAuthStatus
      tags: [auth]
      security: []
      summary: Whether the server has an account and this client is signed in
      responses:
        '200':
          description: Current sign-in state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatus'
  /api/auth/setup:
    post:
      x-alreadyon-roles: [public]
      operationId: setupAccount
      tags: [auth]
      security: []
      summary: Create the first owner account (first run only) and sign in
      description: >
        Allowed only while no account exists; afterwards it returns 409. The
        account is an owner with the default Admin, Teen and Kids profiles.
        Further accounts are created by an owner with POST /api/users. On
        success the response sets the session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Credentials'
                - type: object
                  properties:
                    serverName:
                      type: string
                      minLength: 1
                      maxLength: 64
                      description: Friendly LAN discovery name. Omitted by legacy clients defaults to AlreadyOn. Surrounding whitespace is trimmed; control characters are rejected.
      responses:
        '201':
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatus'
        '400':
          description: Username or password not acceptable
        '409':
          description: The server already has an account
  /api/auth/login:
    post:
      x-alreadyon-roles: [public]
      operationId: login
      tags: [auth]
      security: []
      summary: Sign in with an account's username and password
      description: >
        Sets a session cookie. Five failed attempts from one address lock it
        out for a growing period (429 with Retry-After). A disabled account
        cannot sign in. When the response has `mustChangePassword: true` the
        client must show a password change before anything else.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatus'
        '401':
          description: Wrong username or password
        '409':
          description: The server has no account yet
        '429':
          description: Too many failed attempts
  /api/auth/logout:
    post:
      x-alreadyon-roles: [public]
      operationId: logout
      tags: [auth]
      security: []
      summary: End this browser's session
      responses:
        '204':
          description: Signed out; the cookie is cleared
  /api/auth/session-lifetime:
    get:
      x-alreadyon-roles: [owner]
      operationId: getSessionLifetime
      tags: [auth]
      summary: How many days a signed-in browser stays signed in
      responses:
        '200':
          description: Days, where 0 never expires (default 30)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionLifetime'
    put:
      x-alreadyon-roles: [owner]
      operationId: setSessionLifetime
      tags: [auth]
      summary: Set how long browsers stay signed in
      description: Applies to browsers that sign in afterwards; sessions already signed in keep the expiry they were given.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionLifetime'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionLifetime'
        '400':
          description: Days outside 0 to 3650
  /api/auth/session-inactivity:
    get:
      x-alreadyon-roles: [owner]
      operationId: getInactiveSessionPolicy
      tags: [auth]
      summary: Read inactivity cleanup settings for all session types
      responses:
        '200':
          description: Enabled by default with a 14-day threshold
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InactiveSessionPolicy'
    put:
      x-alreadyon-roles: [owner]
      operationId: setInactiveSessionPolicy
      tags: [auth]
      summary: Configure automatic inactive session removal
      description: Applies to existing and future sessions, including native sessions. Inactivity strictly greater than the threshold invalidates cookies and scoped playback principals. Enabling cleanup removes already inactive sessions immediately. Cleanup also runs on startup and hourly. Disabling cleanup does not restore removed sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InactiveSessionPolicy'
      responses:
        '200':
          description: Saved policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InactiveSessionPolicy'
        '400':
          description: Missing enabled/days or days outside 1 to 3650

  /api/auth/sessions:
    get:
      x-alreadyon-roles: [owner, viewer]
      operationId: listSessions
      tags: [auth]
      summary: Browsers currently signed in
      responses:
        '200':
          description: Live sessions, newest first; `current` marks the caller's own
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BrowserSession'
  /api/auth/sessions/{id}:
    delete:
      x-alreadyon-roles: [owner, viewer]
      operationId: revokeSession
      tags: [auth]
      summary: Sign one browser out
      description: Ending the caller's own session also clears its cookie.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Signed out (also when it was already gone)
  /api/auth/sessions/revoke:
    post:
      x-alreadyon-roles: [owner, viewer]
      operationId: revokeSessions
      tags: [auth]
      summary: Sign out every other browser, or every browser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope]
              properties:
                scope:
                  type: string
                  enum: [others, all]
      responses:
        '200':
          description: How many sessions were ended
          content:
            application/json:
              schema:
                type: object
                properties:
                  signedOut:
                    type: integer
        '400':
          description: Unknown scope
  /api/auth/password:
    post:
      x-alreadyon-roles: [owner, viewer]
      operationId: changePassword
      tags: [auth]
      summary: Change the signed-in account's password
      description: >
        Needs the current password (wrong attempts share the sign-in lockout).
        Every other browser session of the account is ended; the caller's
        stays, and a required password change is cleared. A forgotten password
        is reset by an owner with PUT /api/users/{id}/password, or for the
        last owner with the `reset-password` tool on the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 4
                  maxLength: 256
      responses:
        '204':
          description: Changed
        '400':
          description: New password not acceptable
        '403':
          description: >
            The current password is wrong, or the account is password-locked
            (code `password_locked`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many failed attempts
  /api/auth/username:
    post:
      x-alreadyon-roles: [owner, viewer]
      operationId: changeUsername
      tags: [auth]
      summary: Change the signed-in account's username
      description: >
        Needs the current password (wrong attempts share the sign-in lockout).
        Sessions and API keys stay valid: they belong to the account, not its
        name. A password-locked account cannot rename itself; an owner renames
        it with PATCH /api/users/{id}.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newUsername]
              properties:
                currentPassword:
                  type: string
                newUsername:
                  type: string
                  minLength: 1
                  maxLength: 64
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema:
                type: object
                required: [username]
                properties:
                  username:
                    type: string
        '400':
          description: Username not acceptable
        '403':
          description: >
            The current password is wrong, or the account is password-locked
            (code `password_locked`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Username already in use (code `username_taken`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many failed attempts
  /api/users:
    get:
      x-alreadyon-roles: [owner]
      operationId: listUsers
      tags: [users]
      summary: List accounts
      responses:
        '200':
          description: Every account, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      x-alreadyon-roles: [owner]
      operationId: createUser
      tags: [users]
      summary: Create an account
      description: >
        The new account gets the default Admin, Teen and Kids profiles.
        `maxStreams` defaults to 2 for a viewer and 0 (unlimited) for an owner.
        An account cannot be both `passwordLocked` and `mustChangePassword`,
        because a locked account could never complete the change. A server
        holds at most 100 accounts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid username, password, role or stream limit, or locked together with a required change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Username in use (`username_taken`) or too many accounts (`too_many_users`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      x-alreadyon-roles: [owner]
      operationId: getUser
      tags: [users]
      summary: Get one account
      responses:
        '200':
          description: The account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: No such account
    patch:
      x-alreadyon-roles: [owner]
      operationId: updateUser
      tags: [users]
      summary: Change an account
      description: >
        Only the fields sent are changed. Changing the role or disabling the
        account signs it out everywhere. The last enabled owner cannot be
        demoted or disabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatch'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid value, or locked together with a required change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such account
        '409':
          description: Username in use (`username_taken`) or the last enabled owner (`last_owner`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      x-alreadyon-roles: [owner]
      operationId: deleteUser
      tags: [users]
      summary: Delete an account
      description: >
        Deletes the account with its profiles, browser sessions and API keys.
        An owner cannot delete the account it is signed in with, nor the last
        enabled owner.
      responses:
        '204':
          description: Deleted
        '404':
          description: No such account
        '409':
          description: The caller's own account (`self_delete`) or the last enabled owner (`last_owner`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/users/{id}/password:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      x-alreadyon-roles: [owner]
      operationId: setUserPassword
      tags: [users]
      summary: Set an account's password
      description: >
        An owner sets the password without knowing the old one, optionally
        requiring a change at the next sign-in. The account is signed out
        everywhere.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password:
                  type: string
                  minLength: 4
                  maxLength: 256
                mustChangePassword:
                  type: boolean
                  default: false
      responses:
        '204':
          description: Set
        '400':
          description: Password not acceptable, or a required change on a password-locked account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such account
  /api/openapi.yaml:
    get:
      x-alreadyon-roles: [owner, viewer]
      operationId: getOpenAPISpec
      tags: [admin]
      summary: This API description
      responses:
        '200':
          description: The OpenAPI document
          content:
            application/yaml: {}
  /api/docs/:
    get:
      x-alreadyon-roles: [owner, viewer]
      operationId: getAPIDocs
      tags: [admin]
      summary: Interactive API documentation (Swagger UI)
      description: Viewers can open it, but operations they may not call still answer 403.
      responses:
        '200':
          description: HTML page
  /profile-icons/{file}:
    get:
      x-alreadyon-roles: [owner, viewer]
      operationId: getProfileIcon
      tags: [profiles]
      summary: An uploaded profile icon
      parameters:
        - name: file
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Image file
        '404':
          description: No such icon
  /healthz:
    get:
      x-alreadyon-roles: [public]
      security: []
      operationId: getHealth
      tags: [health]
      summary: Health check
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/status/startup:
    get:
      x-alreadyon-roles: [owner, viewer]
      operationId: getStartupStatus
      tags: [status]
      summary: Background library work status
      description: >
        What the server's background library pipeline is doing: the
        startup scan/classify/populate/schedule run, and later refreshes
        (Refresh Schedule, content polling). Clients poll this to show
        first-run progress instead of an empty guide. `library` counts are
        read live, so they advance during a long scan. Counts cover media
        folders only (not commercials) and exclude missing files.
      responses:
        '200':
          description: Current status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartupStatus'

  /api/logs:
    get:
      x-alreadyon-roles: [owner]
      operationId: getLogs
      tags: [logs]
      summary: Recent in-memory server log entries
      parameters:
        - name: levels
          in: query
          description: Comma-separated levels to include (debug,info,warn,error,critical). Omit for all levels.
          schema:
            type: string
          example: warn,error
        - name: limit
          in: query
